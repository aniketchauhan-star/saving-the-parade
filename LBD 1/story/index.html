    /* Centre point (game-space 1280×720) of a DOM element. */
    function gameSpaceCenter(el) {
      var stage = els.game || document.getElementById("game");
      var sr = stage.getBoundingClientRect();
      var er = el.getBoundingClientRect();
      var sx = 1280 / sr.width;
      var sy = 720 / sr.height;
      return {
        x: (er.left - sr.left + er.width / 2) * sx,
        y: (er.top - sr.top + er.height / 2) * sy,
        w: er.width * sx,
        h: er.height * sy
      };
    }

    /* The seated quarter piece (flying-half) nearest a given corner slot, or
       null if none are seated yet. On the fit/success screen the visible "pod"
       is this piece, not the padded SquareHollow box — so the wire anchors to
       it. Nearest-centre match is order-agnostic (4 pieces, 4 distinct slots). */
    function seatedPieceFor(slot) {
      if (!els.flightLayer) { return null; }
      var pieces = els.flightLayer.querySelectorAll(".flying-half");
      if (!pieces.length) { return null; }
      var sc = gameSpaceCenter(slot), best = null, bestD = Infinity;
      for (var k = 0; k < pieces.length; k++) {
        var pc = gameSpaceCenter(pieces[k]);
        var d = (pc.x - sc.x) * (pc.x - sc.x) + (pc.y - sc.y) * (pc.y - sc.y);
        if (d < bestD) { bestD = d; best = pieces[k]; }
      }
      return best;
    }

    /* Like gameSpaceCenter, but the w/h come from offsetWidth/offsetHeight (the
       layout box, which IGNORES the scale-in transform) while the centre stays
       from the live rect (centre is invariant under the centre-origin scale).
       Used to anchor the charge wires to a hollow's FULL size even while it is
       still popping in — otherwise the last-staggered pod is measured small and
       the start dot gets pulled down inside the hollow. */
    function slotBox(el) {
      var c = gameSpaceCenter(el);
      return { x: c.x, y: c.y, w: el.offsetWidth, h: el.offsetHeight };
    }

    /* Draw glowing white/blue wires from each corner pod to a bot's head and
       animate them drawing in. Pairing: TL→left, BL→mid-left, TR→right,
       BR→mid-right (outer corners to outer bots). */
    /* Circuit-style connectors from each corner pod to a bot head. Geometry is
       computed live from getBoundingClientRect (via gameSpaceCenter) so it
       stays correct at any scale. Each pod gets its OWN <path> (no single giant
       wire), drawn in with a dash sweep, plus a glowing bead that rides the same
       path via SVG animateMotion. Routing matches the Figma reference:
         • Top pods  → across the top, then straight down into the bot head.
         • Bottom pods → short run out, riser up to head height, then in to the head.
       Pairing (outer corners → outer bots, matching the reference):
         TL→bot1(left), BL→bot2(mid-left), TR→bot4(right), BR→bot3(mid-right). */
    /* Global pixel offset for the whole charging-wire bundle, in 1280×720 game
       space. Set from the debug overlay's "pod-connectors" export (grab a wire,
       drag, Download Layout JSON) to nudge all wires into alignment at once. */
    var CONNECTOR_NUDGE = { x: 0, y: 0 };
    /* Per-wire override for the head end of each charging wire (where it lands on
       the bot's head), in 1280×720 game space, pairs order [TL,TR,BL,BR]. null =
       use the computed (bot-x, crown-y) landing. Drag the cyan head dots in the
       debug overlay to tune, then bake the exported {i,x,y} back here. */
    var CONNECTOR_HEADS = [null, null, null, null];
    var connectorWires = [];   /* live wire descriptors so the debug tool can re-route a single head */

    /* L-shaped wire path. Top wires run across then drop into the head; bottom
       wires rise to a rail above the heads, across, then down into the head. */
    function connWirePath(top, sx, sy, hx, hy) {
      var s = sx.toFixed(1), t = sy.toFixed(1), X = hx.toFixed(1), Y = hy.toFixed(1);
      if (top) { return "M " + s + " " + t + " H " + X + " V " + Y; }
      return "M " + s + " " + t + " V " + (hy - 90).toFixed(1) + " H " + X + " V " + Y;
    }
    function connWireLen(top, sx, sy, hx, hy) {
      if (top) { return Math.abs(hx - sx) + Math.abs(hy - sy); }
      var railY = hy - 90;
      return Math.abs(railY - sy) + Math.abs(hx - sx) + Math.abs(hy - railY);
    }
    /* Re-route a single wire to a new head endpoint without redrawing the bundle
       (keeps the others' draw-in/bead timing). */
    function rebuildConnWire(w) {
      if (!w || !w.path) { return; }
      var d = connWirePath(w.top, w.sx, w.sy, w.hx, w.hy);
      w.path.setAttribute("d", d);
      w.path.style.setProperty("--len", connWireLen(w.top, w.sx, w.sy, w.hx, w.hy).toFixed(0));
      if (w.motion) { w.motion.setAttribute("path", d); }
    }
    function playPodConnectors(success, opts) {
      var quiet = !!(opts && opts.quiet);   /* static alignment draw: no SFX, no beads/plugs/glow */
      /* noEnergy: the wires still DRAW IN (the pods connect to the bots), but no
         travelling energy beads / head-plugs / glow / charge SFX. Used by the
         intro charge screens — the actual energy flow is reserved for the
         success screen (when the cut pieces fit the hollows). */
      var noEnergy = !!(opts && opts.noEnergy);
      var svg = els.podConnectors;
      if (!svg) { return; }
      svg.innerHTML = "";
      connectorWires = [];
      svg.style.transform = "translate(" + CONNECTOR_NUDGE.x + "px," + CONNECTOR_NUDGE.y + "px)";
      show(svg);
      /* Success rhythm — strict phases, one beat at a time (design): ① every
         wire draws in → ② every plug seats on its crown (plug SFX) → ③ the
         charge rides the wires and the bots power up → the caller's cheer
         (onAllCharged) follows, and only then the Next button. */
      var WIRES_DONE = 2000;           /* last wire: 0.95s stagger + 1s draw */
      var PLUG_AT = WIRES_DONE;        /* plugs wait for every wire to finish */
      var CHARGE_AT = PLUG_AT + 700;   /* beads wait for every plug to seat */
      if (!quiet && !noEnergy) {
        later(function () { sndPlugConnect(state.round); }, PLUG_AT);
        later(sndPodCharge, CHARGE_AT);   /* electric charge SFX rides with the beads */
      }
      if (!quiet && noEnergy) {
        /* Plug screen: the charge SFX stays reserved for the success screen, but
           the wires still audibly PLUG IN — fire PlugConnect as the first wire
           seats its head-plug (matches the 1500ms seat delay below). */
        var plugSfxRound = state.round;
        later(function () { sndPlugConnect(plugSfxRound); }, 1500);
      }
      var ns = "http://www.w3.org/2000/svg";
      var slotByCls = {};
      els.cornerSlotEls.forEach(function (s) {
        if (s.classList.contains("cs-tl")) slotByCls.tl = s;
        else if (s.classList.contains("cs-tr")) slotByCls.tr = s;
        else if (s.classList.contains("cs-bl")) slotByCls.bl = s;
        else if (s.classList.contains("cs-br")) slotByCls.br = s;
      });
      /* Pairing + routing per Figma node 16:2094:
           TL → bot2 (mid-left), TR → bot3 (mid-right)  — top hollows feed the INNER bots
           BL → bot1 (left),     BR → bot4 (right)       — bottom hollows feed the OUTER bots
         Top wires: across at hollow height, then drop into the head.
         Bottom wires: up to a rail above the heads, across, then down into the head. */
      var pairs = [
        { slot: slotByCls.tl, bot: els.midLeftBot, top: true },
        { slot: slotByCls.tr, bot: els.midRightBot, top: true },
        { slot: slotByCls.bl, bot: els.leftBot, top: false },
        { slot: slotByCls.br, bot: els.rightBot, top: false }
      ];
      var EDGE = 0.30;   /* start at the inner-recess border, not the hollow centre */
      var BOTTOM_EDGE = 0.44;  /* bottom hollows exit at the top rim (higher than EDGE) per Figma 16:2094 */
      var diag = isDiagRound(currentRound());   /* triangle pods sit toward the outer corner */
      var beads = [];
      pairs.forEach(function (p, i) {
        if (!p.slot || !p.bot) { return; }
        var a = gameSpaceCenter(p.slot);   /* pod centre */
        var b = gameSpaceCenter(p.bot);    /* bot centre */
        var headY = b.y - b.h * (success ? 0.52 : 0.30);   /* success: land ON the head-plug crown (~0.52 above centre), not the face. charge screen keeps 0.30, unchanged */
        /* Anchor box for the wire's start. Default: the hollow slot, whose PNG
           pads the sides, so EDGE/BOTTOM_EDGE (<0.5) land on the visible niche
           rim. Non-diag pods use slotBox (transform-independent size) so a pod
           still scaling in isn't measured small — which would pull the start dot
           down inside the hollow. Diag keeps the rotated rect its anchor needs.
           On the fit/success screen the visible pod is the seated piece — smaller
           and unpadded — so anchor to IT at the true edge (0.5), else the dot
           floats in the gap between piece and hollow rim. */
        var pod = diag ? a : slotBox(p.slot), edgeX = EDGE, edgeY = BOTTOM_EDGE;
        if (success && !diag) {
          var seat = seatedPieceFor(p.slot);
          if (seat) { pod = gameSpaceCenter(seat); edgeX = 0.5; edgeY = 0.5; }
        }
        var sx, sy;
        if (diag && !currentRound().diamondHollows) {
          /* triangle1: spring the wire from the SEATED triangle (slot centre + its
             seat nudge), so the line clearly comes out of the pod the player sees. */
          var tnw = triSeatNudgeFor(currentRound(), i);
          sx = a.x + tnw.x;
          sy = a.y + tnw.y;
        } else if (diag) {
          /* diamond (triangle2): anchor on the seated triangle's mass toward the
             centre (its hollows are rotated 180°). */
          var sgx = (p.slot.classList.contains("cs-tr") || p.slot.classList.contains("cs-br")) ? 1 : -1;
          var sgy = (p.slot.classList.contains("cs-bl") || p.slot.classList.contains("cs-br")) ? 1 : -1;
          sgx = -sgx; sgy = -sgy;
          sx = a.x + sgx * a.w / 6;
          sy = a.y + sgy * a.h / 6;
        } else if (p.top) {
          /* top pods exit the left/right edge toward the bot */
          sx = pod.x + (b.x >= pod.x ? 1 : -1) * pod.w * edgeX;
          sy = pod.y;
        } else {
          /* bottom pods exit the top edge (the wire goes up first) */
          sx = pod.x;
          sy = pod.y - pod.h * edgeY;
        }
        /* head landing point — bot crown by default, or a baked/debug override */
        var hx = b.x, hyv = headY;
        if (CONNECTOR_HEADS[i]) { hx = CONNECTOR_HEADS[i].x; hyv = CONNECTOR_HEADS[i].y; }
        var d = connWirePath(p.top, sx, sy, hx, hyv);
        var len = connWireLen(p.top, sx, sy, hx, hyv);

        var path = document.createElementNS(ns, "path");
        path.setAttribute("d", d);
        path.style.setProperty("--len", len.toFixed(0));
        if (quiet) {
          /* Static render (the grid "ready" beat + debug alignment view): show
             the wire already fully drawn, with no draw-on animation. The animated
             draw-on + travelling energy belongs to the success charge only. */
          path.style.animation = "none";
          path.style.strokeDashoffset = "0";
        } else {
          path.style.animationDelay = (0.5 + i * 0.15) + "s";   /* pods settle first, then draw with stagger */
        }
        svg.appendChild(path);

        /* glowing start node on the hollow's border */
        var node = document.createElementNS(ns, "circle");
        node.setAttribute("class", "pod-wire-node");
        node.setAttribute("cx", sx.toFixed(1));
        node.setAttribute("cy", sy.toFixed(1));
        node.setAttribute("r", "5");
        svg.appendChild(node);

        /* record this wire so the debug overlay can drag its head endpoint live */
        connectorWires[i] = { i: i, top: p.top, sx: sx, sy: sy, hx: hx, hy: hyv, path: path, node: node, motion: null };

        if (quiet || noEnergy) {
          /* Seat the head-plug connector on the bot's crown so the wire reads as
             plugged in, then leave it there — but NO travelling energy bead and
             NO charge glow (the energy flow + power-up belong to the success
             charge alone). quiet (ready screen): wires are static, so seat at
             once. noEnergy (plug screen): seat as the drawing wire reaches the
             head. */
          if (p.bot) {
            if (quiet) { seatHeadPlug(p.bot, success); }
            else { later(function () { seatHeadPlug(p.bot, success); }, 1500 + i * 150); }
          }
          return;
        }

        /* travelling electricity bead — rides this exact path */
        var bead = document.createElementNS(ns, "circle");
        bead.setAttribute("class", "pod-energy");
        bead.setAttribute("r", "5.5");
        bead.setAttribute("cx", "0");
        bead.setAttribute("cy", "0");
        var motion = document.createElementNS(ns, "animateMotion");
        motion.setAttribute("path", d);
        motion.setAttribute("dur", "1.1s");
        motion.setAttribute("begin", "indefinite"); /* triggered in JS so it ignores the page-load timeline */
        /* Energy travels the wire exactly once, then rests at the bot head
           (fill=freeze) — the charge is "delivered" and the head glows. */
        motion.setAttribute("repeatCount", "1");
        motion.setAttribute("fill", "freeze");
        motion.setAttribute("calcMode", "spline");
        motion.setAttribute("keyTimes", "0;1");
        motion.setAttribute("keySplines", "0.22 1 0.36 1");
        bead.appendChild(motion);
        svg.appendChild(bead);
        connectorWires[i].motion = motion;
        beads.push({ motion: motion, delay: CHARGE_AT + i * 150, bot: p.bot }); /* phase ③: energy travels only after every plug is seated */
      });

      /* Phase ② — all wires are in by PLUG_AT; ripple the four plugs onto the
         crowns. Phase ③ — kick each bead off relative to NOW (beginElement)
         so the staggered timing is correct no matter how long the page has
         been open. The bead rides the wire with an ease-out spline and has
         visually reached the head ~0.8s after launch — glow the bot and fire
         onBotCharged (power-up) right then. */
      var ARRIVE = 800;
      beads.forEach(function (be, i) {
        later(function () { seatHeadPlug(be.bot, success); }, PLUG_AT + i * 150);
        later(function () { try { be.motion.beginElement(); } catch (e) { } }, be.delay);
        later(function () {
          if (be.bot) { be.bot.classList.add("pod-charged-glow"); }
          if (opts && opts.onBotCharged) { opts.onBotCharged(be.bot, i); }
        }, be.delay + ARRIVE);
      });
      /* Once the LAST bot's energy has landed, let the caller run its
         after-charge beat (e.g. the "Yay, the bots are charged" panel + audio). */
      if (!quiet && opts && opts.onAllCharged && beads.length) {
        var lastDelay = beads.reduce(function (m, be) { return Math.max(m, be.delay); }, 0);
        later(function () { opts.onAllCharged(); }, lastDelay + ARRIVE + 150);
      }
    }

    /* Debug-overlay hooks: drag each wire's head endpoint (where it meets the
       bot head) and export. Coords are 1280×720 game space, pairs order
       [TL,TR,BL,BR]. The overlay reads/sets these; values get baked into
       CONNECTOR_HEADS above. */
    window.__connectorHeads = function () {
      return connectorWires.filter(Boolean).map(function (w) {
        return { i: w.i, x: Math.round(w.hx * 10) / 10, y: Math.round(w.hy * 10) / 10, top: w.top };
      });
    };
    window.__connectorNudge = function () { return { x: CONNECTOR_NUDGE.x, y: CONNECTOR_NUDGE.y }; };
    window.__setConnectorHead = function (i, x, y) {
      CONNECTOR_HEADS[i] = { x: x, y: y };
      var w = connectorWires[i];
      if (w) { w.hx = x; w.hy = y; rebuildConnWire(w); }
    };

    /* Charger plug (CSS/SVG only, mirrors the reference art) seated on top of a
       bot's head the moment its wire's energy bead arrives. Appended into the
       bot-slot so it tracks the bot; removed in resetScene() on the next screen. */
    function headPlugMarkup() {
      return "" +
        '<div class="hp-knob"></div>' +
        '<div class="hp-body"></div>' +
        '<svg class="hp-bolt" viewBox="0 0 22 31" aria-hidden="true">' +
        '<path d="M13 2 L5 17 L10.5 17 L9 30 L18 11 L12 11 Z" fill="none" ' +
        'stroke="#2bc3f2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>' +
        "</svg>";
    }

    function seatHeadPlug(bot, success) {
      if (!bot || !bot.parentNode) { return; }
      var slot = bot.parentNode;
      if (slot.querySelector(".head-plug")) { return; }   /* already seated */
      var plug = document.createElement("div");
      plug.className = "head-plug" + (success ? " seat-success" : "");
      plug.innerHTML = headPlugMarkup();
      slot.appendChild(plug);
      /* next frame so the connect animation plays from its start state */
      requestAnimationFrame(function () { plug.classList.add("connected"); });
    }

    function setupPlugReady(text) {
      els.sceneBg.style.display = "block";
      setupBots("layout-intro-connected");
      setInstruction(text);
      var plugRound = state.round;
      if (!state.plugConnectPlayed[plugRound]) {
        later(function () { sndPlugConnect(plugRound); }, 80);
      }
    }

    /* Grid round "ready to get charged" beat — shown after the pod/charge
       screen. Same 4-bot + corner-pod layout, now with the instruction panel.
       The upper hollows use slots-fit so they DROP clear of the panel: the plug
       screen has no panel, so its uppers sit higher (plain slots-connector,
       top:109) and would collide with the panel (bottom ≈158). The connector
       wires recompute from the live pod centres, so they follow the drop. */
    function setupGridReady(text) {
      var r = currentRound();
      els.sceneBg.style.display = "block";
      els.bots.className = "layout-corners4";
      [els.leftBot, els.rightBot, els.midLeftBot, els.midRightBot].forEach(function (b) {
        b.src = r.sadBot;
        b.className = "bot-img";
        b.style.width = "";
        b.style.bottom = "";
        b.style.marginLeft = "";
      });
      els.cornerSlots.classList.remove("slots-high");
      els.cornerSlots.classList.add("slots-connector", "slots-fit");   /* slots-fit drops the upper hollows clear of the panel */
      show(els.cornerSlots);
      /* The pods + wires were already on screen during the pod/charge beat, so
         show them ALREADY settled here (suppress the scale-in pop) and draw the
         wires SYNCHRONOUSLY. Drawing in the same renderStep turn as resetScene's
         clear means no empty-connector frame is ever painted — the connectors
         don't visibly "disappear" then redraw. */
      els.cornerSlotEls.forEach(function (slot) {
        slot.style.transition = "none";
        slot.classList.add("show");
      });
      void els.cornerSlots.offsetWidth;   /* commit the no-transition show before restoring the transition */
      els.cornerSlotEls.forEach(function (slot) { slot.style.transition = ""; });
      setInstruction(text);   /* shows the panel + plays the mapped "ready to get charged" audio */
      /* Static wires only: quiet skips the travelling energy beads AND the
         draw-on animation (see playPodConnectors), so this reads as "still
         connected" — the energy flow belongs to the success charge alone. */
      playPodConnectors(false, { quiet: true });
    }

    function setupMoveOut() {
      els.sceneBg.style.display = "block";
      setInstruction("");
      setupBots("layout-ready", { moveFromCenter: true });
      later(sndBotsMove, 80);
    }

    function setupWholeIntro(text) {
      els.sceneBg.style.display = "block";
      if (els.focusDim) { els.focusDim.classList.add("show"); }   /* dim bg, spotlight the block + hollows */
      if (currentRound().cut === "grid") { setupGridBots({ showBots: false, showSlots: true }); }
      else { setupBots("layout-ready"); }
      setInstruction("");
      renderWhole(true);
      later(function () {
        setInstruction(text);
      }, 680);
    }

    /* Guided slot preview for the grid round (Figma 11:1908): the four quarter
       pieces sit in a 2×2 at centre, a curved dashed arrow arcs from each piece
       to its corner hollow, and the pieces travel along those arcs into the
       hollows and back to centre, looping until the scene advances. */
    function gridSlotPreview() {
      var r = currentRound();
      els.flightLayer.innerHTML = "";   /* clears any stale guide + pieces */
      hide(els.shapeStage);
      /* Seat the preview pieces at the SAME spot as the real success/fit screen
         (flyQuartersToCorners non-diag): slot centre + SquareHollow's left/up
         cavity offset, so the demo lands the pieces exactly where they'll seat. */
      var nudgeX = r.slotNudge ? r.slotNudge.x : -4;
      var nudgeY = r.slotNudge ? r.slotNudge.y : -3;

      var slots = els.cornerSlotEls.map(function (s) { return gameSpaceCenter(s); });
      var cx = 640, cy = 360, gap = 5;
      var anims = [];

      /* Diagonal rounds: the cut block's four diagonal triangles fly out from the
         centre. Each starts as its cut quarter (the four tile the block) and OPENS
         OUT (clip morph) into the seated corner triangle as it slides to its slot
         and shrinks from block size to the cavity — a single fly-out, then hold. */
      if (isDiagRound(r)) {
        var dnx = r.slotNudge ? r.slotNudge.x : 0, dny = r.slotNudge ? r.slotNudge.y : 0;
        els.cornerSlotEls.forEach(function (slot, i) {
          var sc = slots[i];
          var box = triSeatBox(r, sc);
          var piece = makeCornerTriangle(r, i, box.w, box.h, r.diamondHollows ? 0 : 1);
          piece.style.position = "absolute";
          /* Assemble as a square: place each piece so its apex meets at the centre. */
          var pStartScale = (r.blockW || 200) / box.w;
          var paf = (!r.diamondHollows && TRI_APEX_FRAC[i]) ? TRI_APEX_FRAC[i] : [0.5, 0.5];
          var sCx = cx - (paf[0] - 0.5) * box.w * pStartScale;
          var sCy = cy - (paf[1] - 0.5) * box.h * pStartScale;
          piece.style.left = (sCx - box.w / 2) + "px";
          piece.style.top = (sCy - box.h / 2) + "px";
          els.flightLayer.appendChild(piece);
          var ptnu = triSeatNudgeFor(r, i);
          var ex = sc.x + dnx + ptnu.x, ey = sc.y + dny + ptnu.y;   /* seat = nested in hollow */
          /* Clean radial guide: a gentle tangential bow (shared sign → the four
             arcs pinwheel instead of crossing the block); arrow starts at the
             block edge and its head points straight at the hollow. */
          var dx = ex - cx, dy = ey - cy;
          var len = Math.sqrt(dx * dx + dy * dy) || 1;
          var ux = dx / len, uy = dy / len;
          var ctlX = (cx + ex) / 2 - uy * 26, ctlY = (cy + ey) / 2 + ux * 26;
          /* Aim the arrow at the seated triangle's CENTROID (the filled centre of
             the hollow). The hollow's box centre sits on the piece's hypotenuse
             edge, so an arrow ending there reads as "pointing at the border".
             Diamond only; triangle1 keeps the box-centre target. The piece still
             SEATS at ex,ey — only the guide arrow is re-aimed. */
          var aimX = ex, aimY = ey;
          if (r.diamondHollows) {
            var t1 = DIAMOND_T1[i] || DIAMOND_T1[0];
            var ccx = (t1[0][0] + t1[1][0] + t1[2][0]) / 3, ccy = (t1[0][1] + t1[1][1] + t1[2][1]) / 3;
            aimX = ex + (ccx - 50) / 100 * box.w;
            aimY = ey + (ccy - 50) / 100 * box.h;
          }
          addSlotPathGuide(cx + ux * 104, cy + uy * 104, ctlX, ctlY, aimX, aimY, i);
          /* start ASSEMBLED at block size (the four cut quarters tile a clean
             square at centre); the bounce then carries them out to the hollows. */
          piece.style.transform = "scale(" + pStartScale.toFixed(3) + ")";
          anims.push({ piece: piece, sx: sCx, sy: sCy, cx2: ctlX, cy2: ctlY, ex: ex, ey: ey, diag: true, corner: i, startScale: pStartScale });
        });
      } else {
        [0, 1, 2, 3].forEach(function (i) {
          var slot = slots[i];
          var g = gridQuarterGeometry(r.blockW, r.blockH, i);
          /* Start TOUCHING (the four quarters form the whole block); the split
             reveal then nudges each outward before they fly. */
          /* Start TOUCHING — the four quarters form a clean whole block at centre. */
          var pcx = cx - r.blockW / 2 + g.minX + g.width / 2;
          var pcy = cy - r.blockH / 2 + g.minY + g.height / 2;
          var piece = makeQuarterPiece(r, i, r.blockW, r.blockH);
          piece.classList.add("flying-half");
          piece.style.position = "absolute";
          piece.style.left = (pcx - g.width / 2) + "px";
          piece.style.top = (pcy - g.height / 2) + "px";
          piece.style.transformOrigin = "center center";
          piece.style.filter = "none";
          els.flightLayer.appendChild(piece);

          /* Curved arrow: top pieces bow up to the top hollows, bottom pieces bow
             down to the bottom hollows — matches the four arcs in the design. */
          var bow = (i < 2) ? -70 : 70;
          var ctrlX = (pcx + slot.x) / 2, ctrlY = (pcy + slot.y) / 2 + bow;
          /* Seated size. Default: ≈94px longest side (covers the square hollow).
             Rounds with slotFill fill the hollow box per-axis (the wide rectangle
             hollow needs a wider/shorter piece than a uniform square scale gives). */
          var seatX, seatY;
          if (r.squareSeat) {
            /* square seat off the hollow's short side (circle quarters) */
            var qs = Math.min(slot.w, slot.h) * r.slotFill.w;
            seatX = qs / g.width; seatY = qs / g.height;
          } else if (r.slotFill) {
            seatX = (slot.w * r.slotFill.w) / g.width;
            seatY = (slot.h * r.slotFill.h) / g.height;
          } else {
            seatX = seatY = 94 / Math.max(g.width, g.height);
          }
          addSlotPathGuide(pcx, pcy, ctrlX, ctrlY, slot.x, slot.y, i);
          var bn = boxSeatNudgeFor(r, i);
          anims.push({ piece: piece, sx: pcx, sy: pcy, cx2: ctrlX, cy2: ctrlY, ex: slot.x + nudgeX + bn.x, ey: slot.y + nudgeY + bn.y, seatX: seatX, seatY: seatY });
        });
      }

      /* The four parts start ASSEMBLED as a clean block at centre (t=0). After a
         short beat showing the whole block, they BOUNCE into the hollows twice:
           seg 0  out  → hollows (t 0→1, opens into the seated pieces)
           seg 1  back → centre  (t 1→0, re-forms the whole block)
           seg 2  out  → hollows (t 0→1)  ... then hold and advance.
         So the demo reads "whole block → fits the slots → back to whole → fits
         again", landing in the hollows. */
      var SEG = 1500, HOLD = 650, SHOW_SQUARE = 600, MAX_SEG = 2;   /* HOLD pauses on the re-formed square between trips */
      var seg = 0, segStart = null, startTime = null;
      function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
      function applyPiece(a, px, py, t) {
        var tx = (px - a.sx).toFixed(1), ty = (py - a.sy).toFixed(1);
        if (a.diag) {
          var s = a.startScale + (1 - a.startScale) * t;
          a.piece.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + s.toFixed(3) + ")";
          /* triangle1 keeps its constant shape (clip on the rotated inner, no morph)
             and just slides in; diamond opens out (t=0 tiles → t=1 seats). */
          if (r.diamondHollows) { a.piece.style.clipPath = triClipAt(a.corner, t); }
        } else {
          var scX = 1 + (a.seatX - 1) * t, scY = 1 + (a.seatY - 1) * t;
          a.piece.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scX.toFixed(3) + "," + scY.toFixed(3) + ")";
        }
      }
      function frame(now) {
        if (startTime === null) { startTime = now; }
        if (now - startTime < SHOW_SQUARE) {
          /* hold the assembled whole block (t=0, at centre) before the bounce */
          anims.forEach(function (a) { applyPiece(a, a.sx, a.sy, 0); });
          state.previewRaf = requestAnimationFrame(frame);
          return;
        }
        if (segStart === null) { segStart = now; }
        var raw = Math.max(0, Math.min(1, (now - segStart) / SEG));
        var t = (seg % 2 === 0) ? ease(raw) : 1 - ease(raw);   /* even = out, odd = back */
        anims.forEach(function (a) {
          var p = bezierPoint(a.sx, a.sy, a.cx2, a.cy2, a.ex, a.ey, t);
          applyPiece(a, p.x, p.y, t);
        });
        if (raw >= 1) {
          if (seg >= MAX_SEG) { state.previewRaf = null; return; }   /* held in the hollows after out-back-out */
          seg++; segStart = now + HOLD;
        }
        state.previewRaf = requestAnimationFrame(frame);
      }
      state.previewRaf = requestAnimationFrame(frame);
    }

    /* Pre-game beat ①: the whole block glows under the focus dim — attention on
       WHAT gets cut. The slots stay visible for context but unglowed; beat ②
       (setupSlotInstruct) hands the focus to them. Runs every round. */
    function setupCutInstruct(text) {
      var r = currentRound();
      els.sceneBg.style.display = "block";
      els.focusDim.classList.add("show");   /* dim bg, spotlight the block */
      if (r.cut === "grid") { setupGridBots({ showBots: false, showSlots: true }); }
      else { setupBots("layout-ready"); }
      setInstruction(text);
      renderWhole(true);   /* whole block with static-glow */
    }

    /* Round-0 story beat before the tutorial: same "fit into the slots" line,
       but WITH the guided fly-in preview — the pieces arc into the hollows
       along dashed arrows. The per-round pre-game slotInstruct keeps the
       calmer alpha-glow pulse instead. */
    function setupSlotPreview(text) {
      var r = currentRound();
      els.sceneBg.style.display = "block";
      els.focusDim.classList.add("show");   /* dim bg, spotlight the hollow slots */
      if (r.cut === "grid") {
        setupGridBots({ showBots: false, showSlots: true });
        setInstruction(text);
        /* Let the hollows pop in, then run the guided arrow preview. */
        later(gridSlotPreview, 350);
      } else {
        setupBots("layout-ready");
        setInstruction(text);
        renderWhole(false);
        setSocketFocus(true);
        later(function () { setSocketFocus(true); }, 500);
      }
    }

    /* Settled slot box for seat math: centre from the live rect (invariant
       under the pop-in scale/rotate transition), size from LAYOUT
       (offsetWidth/Height — immune to a mid-transition scale, unlike the
       bounding rect the fit screen measures on settled slots). Hollows rotated
       ±90° (circle round) swap sides, because the seat calibrations were
       measured against the rotated AABB. */
    function settledSlotRect(slot) {
      var c = gameSpaceCenter(slot);
      var w = slot.offsetWidth, h = slot.offsetHeight;
      var rot = Math.abs(parseFloat(slot.style.getPropertyValue("--cs-rot")) || 0) % 180;
      if (rot === 90) { var t = w; w = h; h = t; }
      return { x: c.x, y: c.y, w: w, h: h };
    }

    /* Outer outline of each box-hollow's visible art, measured from the
       asset's opaque pixels (fractions of the FULL image canvas, transparent
       padding included — the same box offsetWidth/offsetHeight report).
       cx/cy is the outline's centre, w/h its size, r the art's corner
       rounding at display scale (arc:true = quarter-disc, radius corner
       follows the slot rotation instead). The pod's frame band displays
       ~4px thick — same as the highlight's border — so a frame seated on
       this box puts the cyan stroke right on the pod's outline. The art is
       NOT centred in its canvas, so these replace the piece-seat
       slotFill/slotNudge for the highlight. The box branch spins these
       fractions with the slot's --cs-rot (90° multiples). */
    var HOLLOW_OUTLINE_GEOMETRY = {
      "SquareHollow.webp": { cx: 0.4781, cy: 0.4730, w: 0.5641, h: 0.8404, r: "2px" },
      "RectangleHollow.webp": { cx: 0.5000, cy: 0.4974, w: 0.9337, h: 0.7270, r: "0" },
      "Quarter.webp": { cx: 0.4828, cy: 0.4989, w: 0.8028, h: 0.7749, arc: true }
    };

    /* Quarter-disc arc corner per --cs-rot (border-radius order TL TR BR BL):
       the unrotated Quarter art's arc is at the top-left, straight edges at
       right + bottom. */
    var ARC_RADIUS_BY_ROT = { 0: "100% 0 0 0", 90: "0 100% 0 0", 180: "0 0 100% 0", 270: "0 0 0 100%" };

    /* Triangle-hollow art outline, as vertices in canvas fractions (sharp
       corners fitted through the art's straight edges — the asset's own
       corner tips are rounded, which stroke-linejoin:round emulates). The
       slots spin this art per corner via --cs-rot, so the highlight rotates
       the same vertices around the image centre instead of keeping four
       hand-calibrated seats. */
    var HOLLOW_OUTLINE_TRI = {
      "triangleHollow.webp": [[0.1534, 0.1070], [0.8683, 0.1070], [0.1534, 0.9086]]
    };

    /* Hollow highlight (slotInstruct): pulsing frames whose stroke sits on
       the pod's outline (measured outline box where available, else the
       same seat math as flyQuartersToCorners / __debugRenderFit) — lit
       interior + bright cyan rim, so the pod itself lights up. Ghosts live
       in flightLayer, which resetScene clears on every scene change. */
    function showSlotCavityGlow(r) {
      var INNER = 0.52, hw = r.blockW / 2, hh = r.blockH / 2;
      var nx = r.slotNudge ? r.slotNudge.x : -4;
      var ny = r.slotNudge ? r.slotNudge.y : -3;
      var svgNs = "http://www.w3.org/2000/svg";
      els.cornerSlotEls.forEach(function (slot, i) {
        var sc = settledSlotRect(slot);
        var ghost;
        if (isDiagRound(r)) {
          /* Triangle pod: SVG polygon (fill + stroke rim) traced on the pod
             art's outline — a border/box-shadow frame can't follow a
             non-rectangular edge. Vertices come from the asset measurement,
             spun by the slot's own --cs-rot around the image centre. */
          var tri = HOLLOW_OUTLINE_TRI[podBasename(r.cornerSlot)] || HOLLOW_OUTLINE_TRI["triangleHollow.webp"];
          var rad = (parseFloat(slot.style.getPropertyValue("--cs-rot")) || 0) * Math.PI / 180;
          var cosR = Math.cos(rad), sinR = Math.sin(rad);
          var iw = slot.offsetWidth, ih = slot.offsetHeight;
          var pts = tri.map(function (v) {
            var vx = (v[0] - 0.5) * iw, vy = (v[1] - 0.5) * ih;
            return [vx * cosR - vy * sinR, vx * sinR + vy * cosR];
          });
          var minX = Math.min(pts[0][0], pts[1][0], pts[2][0]), maxX = Math.max(pts[0][0], pts[1][0], pts[2][0]);
          var minY = Math.min(pts[0][1], pts[1][1], pts[2][1]), maxY = Math.max(pts[0][1], pts[1][1], pts[2][1]);
          var PAD = 8;   /* keeps the centred 4px stroke inside the viewBox */
          var bw = (maxX - minX) + PAD * 2, bh = (maxY - minY) + PAD * 2;
          ghost = document.createElementNS(svgNs, "svg");
          ghost.setAttribute("width", bw);
          ghost.setAttribute("height", bh);
          ghost.setAttribute("viewBox", "0 0 " + bw + " " + bh);
          ghost.setAttribute("class", "pod-hollow-focus-tri");
          ghost.setAttribute("aria-hidden", "true");
          var poly = document.createElementNS(svgNs, "polygon");
          poly.setAttribute("points", pts.map(function (p) {
            return (p[0] - minX + PAD).toFixed(1) + "," + (p[1] - minY + PAD).toFixed(1);
          }).join(" "));
          poly.setAttribute("fill", "rgba(47, 255, 255, .16)");
          poly.setAttribute("stroke", "#2fffff");
          poly.setAttribute("stroke-width", "4");
          poly.setAttribute("stroke-linejoin", "round");
          ghost.appendChild(poly);
          ghost.style.position = "absolute";
          ghost.style.left = (sc.x + minX - PAD) + "px";
          ghost.style.top = (sc.y + minY - PAD) + "px";
        } else {
          /* Box cavity (square / rect / quarter-circle): the bordered frame
             with lit interior + inset glows; border-radius shapes the quarter
             rounds. Assets with a measured outline box sit the stroke on the
             pod's own outline (outline spun with the slot's --cs-rot); the
             rest fall back to the piece-seat fractions. */
          var rot = (((parseFloat(slot.style.getPropertyValue("--cs-rot")) || 0) % 360) + 360) % 360;
          var cav = rot % 90 === 0 ? HOLLOW_OUTLINE_GEOMETRY[podBasename(r.cornerSlot)] : null;
          var dispW, dispH, gx = nx, gy = ny;
          if (cav) {
            var iw = slot.offsetWidth, ih = slot.offsetHeight;
            var swap = rot === 90 || rot === 270;
            dispW = swap ? cav.h * ih : cav.w * iw;
            dispH = swap ? cav.w * iw : cav.h * ih;
            var rad = rot * Math.PI / 180;
            var ox = (cav.cx - 0.5) * iw, oy = (cav.cy - 0.5) * ih;
            gx = ox * Math.cos(rad) - oy * Math.sin(rad);
            gy = ox * Math.sin(rad) + oy * Math.cos(rad);
          } else if (r.squareSeat) {
            dispW = dispH = Math.min(sc.w, sc.h) * r.slotFill.w;
          } else if (r.slotFill) {
            dispW = sc.w * r.slotFill.w;
            dispH = sc.h * r.slotFill.h;
          } else {
            dispW = sc.w * INNER;
            dispH = dispW * (hh / hw);
          }
          ghost = document.createElement("div");
          ghost.className = "pod-cavity-focus-frame";
          ghost.setAttribute("aria-hidden", "true");
          ghost.style.width = dispW + "px";
          ghost.style.height = dispH + "px";
          ghost.style.left = (sc.x + gx - dispW / 2) + "px";
          ghost.style.top = (sc.y + gy - dispH / 2) + "px";
          ghost.style.borderRadius = cav ? (cav.arc ? ARC_RADIUS_BY_ROT[rot] : cav.r) : quarterRadius(r, i);
        }
        els.flightLayer.appendChild(ghost);
      });
      show(els.flightLayer);
    }

    function clearSlotCavityGlow() {
      var ghosts = els.flightLayer.querySelectorAll(".pod-cavity-focus-frame, .pod-hollow-focus-tri");
      for (var i = 0; i < ghosts.length; i++) { ghosts[i].parentNode.removeChild(ghosts[i]); }
    }

    function setupSlotInstruct(text) {
      var r = currentRound();
      els.sceneBg.style.display = "block";
      els.focusDim.classList.add("show");   /* dim bg, spotlight the hollow slots */
      if (r.cut === "grid") {
        setupGridBots({ showBots: false, showSlots: true });
        setInstruction(text);
        renderWhole(false);   /* central block present, no glow — the pulsing hollows keep the focus */
        /* Let the hollows FINISH their pop-in (.45s scale-in + a beat), then
           pulse the cavity highlight for four breaths — no piece fly-in here,
           attention stays on the hollows. Measuring mid-pop-in read the slots
           at a transient scale and misplaced the frames. */
        later(function () { showSlotCavityGlow(r); }, 600);
        later(clearSlotCavityGlow, 4920);   /* 600ms settle + 4 × 1.08s pulses */
      } else {
        setupBots("layout-ready");
        setInstruction(text);
        /* No block glow on this screen — attention should land on the
           hollow slots only, since the instruction is about fitting parts
           into them. */
        renderWhole(false);
        setSocketFocus(true);
        later(function () { setSocketFocus(true); }, 500);
      }
    }

    function renderStep() {
      clearTimers();
      resetScene();
      playScreenFade();

      var r = currentRound();
      var step = FLOW[state.step];
      var text = step.text ? step.text.replace("{shape}", r.name) : "";

      /* Backgrounds: only the bot screens use the studio room (Mainbg) + the
         light-cone spotlight — the charge screens (intro, plug, and the grid
         round's "ready" beat, which continues the same charging scene) here,
         and the fit screen (set in gridFitFlow, which doesn't re-run
         renderStep). Every other screen — including the cutting screens — uses
         the plain Bg2 gradient. The tutorial overrides this with its own bg. */
      var isBotScreen = (step.scene === "intro" || step.scene === "plug" ||
        (step.scene === "plugReady" && r.cut === "grid"));
      els.sceneBg.src = ASSETS + (isBotScreen ? "Mainbg.webp" : "Bg2.webp");
      if (els.botSpotlight) {
        if (step.scene === "intro") {
          /* Bots register first, then the charge beam flashes on with an SFX and
             holds. resetScene already cleared the spotlight for the bots-only beat.
             When the lab gate is mid-open the intro renders behind the closed
             doors — runLabGate fires the beam once they finish, so skip it here. */
          if (!state.gateOpening) { later(playChargeBeam, TIMING.CHARGE_BEAM_IN); }
        } else {
          els.botSpotlight.classList.toggle("show", isBotScreen);
        }
      }

      /* Later rounds re-run ONLY the two pre-game instruction beats
         (cutInstruct + slotInstruct, reskinned via currentRound()) before
         their laser screen — the story teaching beats (whole/quarters), the
         one-time charge intro and the interactive laser tutorial are
         round-0 only. */
      if (state.round > 0) {
        if (step.scene === "intro" || step.scene === "plug" || step.scene === "plugReady" ||
          step.scene === "moveOut" || step.scene === "whole" || step.scene === "quarters" ||
          step.scene === "needs" ||
          step.scene === "halves" || step.scene === "laserIntro" || step.scene === "slotPreview" ||
          step.scene === "tutorial" || step.scene === "preplay") {
          nextStep();
          return;
        }
      }

      if (step.scene === "intro") {
        setupIntro4();
      }

      if (step.scene === "plug") {
        setupCorners4();
        /* Connect the wires (they draw in) but WITHOUT the travelling energy —
           the dot/energy flow is reserved for the success screen. */
        if (r.cut === "grid") { later(function () { playPodConnectors(false, { noEnergy: true }); }, 760); }
      }

      /* Grid round keeps the 4-bot/corner layout and skips the 2-bot
         "move out"/"laser intro" beats — its intro runs
         charge → pods → ready → whole → quarters → tutorial (plugReady shows
         the "ready to get charged" panel via the grid-specific setup). */
      if (step.scene === "plugReady") {
        if (r.cut === "grid") { setupGridReady(text); }
        else { setupPlugReady(text); }
      }

      if (step.scene === "moveOut") {
        if (r.cut === "grid") { nextStep(); return; }
        setupMoveOut();
      }

      if (step.scene === "whole") {
        setupWholeIntro(text);
      }

      /* Grid rounds get the four-part split demo and skip the 2-part demos. */
      if (step.scene === "quarters") {
        if (r.cut !== "grid") { nextStep(); return; }
        els.sceneBg.style.display = "block";
        els.focusDim.classList.add("show");   /* dim bg, spotlight the block + hollows */
        setupGridBots({ showBots: false, showSlots: true });
        setInstruction("");
        renderQuarterCue();
        later(function () { setInstruction(text); }, 680);
      }

      if (step.scene === "needs") {
        if (r.cut === "grid") { nextStep(); return; }
        els.sceneBg.style.display = "block";
        setInstruction(text);
        setupBots("layout-ready");
        renderWhole(false, "halves");
      }

      if (step.scene === "halves") {
        if (r.cut === "grid") { nextStep(); return; }
        els.sceneBg.style.display = "block";
        setInstruction(text);
        setupBots("layout-ready");
        renderSplitCue();
      }

      if (step.scene === "play") {
        if (state.round > 0) { nextStep(); return; }
        state.locked = false;
        setInstruction("");
        setupBots("layout-clear");
        els.playBg.src = ASSETS + "GameStartScreen.webp";
        els.playButtonImg.src = ASSETS + "Button.webp";
        els.playButtonImg.alt = "Let's Go";
        els.playButton.setAttribute("aria-label", "Let's go");
        els.playStage.classList.add("start-mode");
        els.iraChar.classList.remove("play-idle");
        els.iraChar.style.transition = "";
        els.iraChar.style.transform = "";
        els.iraGlowRing.classList.remove("show");
        els.playStage.classList.remove("play-exit");
        els.playButton.classList.remove("play-ready", "play-clicked");
        els.playButton.style.opacity = "0";
        els.playButton.style.transform = "scale(0.85) translateY(16px)";
        show(els.playStage);
        later(function () {
          els.playButton.style.opacity = "1";
          els.playButton.style.transform = "scale(1) translateY(0)";
        }, 220);
        later(function () {
          els.playButton.classList.add("play-ready");
        }, 560);
      }

      if (step.scene === "tutorial") {
        if (state.round > 0) {
          nextStep();
          return;
        }
        setupTutorial();
        return;
      }

      if (step.scene === "preplay") {
        setupPreplay(text);
      }

      if (step.scene === "laserIntro") {
        if (r.cut === "grid") { setupGridLaserIntro(text); }
        else { setupLaserIntro(text); }
      }

      if (step.scene === "cutInstruct") {
        setupCutInstruct(text);
      }

      if (step.scene === "slotPreview") {
        setupSlotPreview(text);
      }

      if (step.scene === "slotInstruct") {
        setupSlotInstruct(text);
      }

      if (step.scene === "laser") {
        setupLaser();
        return;
      }

      if (step.duration) {
        later(nextStep, step.duration);
      }
    }

    function nextStep() {
      state.step++;
      if (state.step >= FLOW.length) {
        state.step = FLOW.length - 1;
      }
      renderStep();
    }

    /* ── Tutorial guided sequence (2 cuts → 4 quarters) ──
       One vertical cut splits the block into two halves; rotating the laser a
       quarter turn and making one horizontal cut splits those halves into four
       equal pieces. */
    var TUTORIAL_START_ANGLE = 45;            /* laser at 45° → diagonal; first move brings it to vertical */
    /* Smaller block for the tutorial so it sits comfortably inside the ring. */
    var TUT_BLOCK = 200;
    var TUT = [
      { bubble: "left", btn: "left" },    /* step 0: rotate +45 → 90° (vertical) */
      { bubble: "cut", btn: "cut" },     /* step 1: vertical cut → 2 halves */
      { bubble: "left", btn: "left" },    /* step 2: rotate +45 → 135° */
      { bubble: "left", btn: "left" },    /* step 3: rotate +45 → 180° (horizontal) */
      { bubble: "cut", btn: "cut" }      /* step 4: horizontal cut → 4 quarters, advance */
    ];

    function setupTutorial() {
      var r = currentRound();
      state.tutActive = true;
      state.tutStep = -1;
      state.tutMoveVOPlayed = false;
      state.tutCutVOPlayed = false;
      state.locked = false;
      state.angle = TUTORIAL_START_ANGLE;
      /* Decode-gate the tutorial background swap. resetScene already left
         sceneBg at display:none with src=Mainbg.webp; if we flip src to
         BgForTutorial and show it before the new bitmap is decoded, the
         element repaints its last-decoded frame (Mainbg) for a frame — the
         reported "wrong background for a sec" flash. Keep it hidden, swap the
         src, then reveal only once the new bitmap is ready. The asset is
         warm-cached at startup, so decode() resolves on the next microtask
         and the reveal is effectively instant with no Mainbg frame. */
      els.sceneBg.style.display = "none";
      els.sceneBg.src = ASSETS + "BgForTutorial.webp";
      var revealTutorialBg = function () { els.sceneBg.style.display = "block"; };
      if (typeof els.sceneBg.decode === "function") {
        els.sceneBg.decode().then(revealTutorialBg, revealTutorialBg);
      } else {
        revealTutorialBg();
      }
      /* Grid round's tutorial cuts only in the machine — no side bots / slots.
         (Using layout-laser here flashed two sideways bots during the
         game→tutorial transition.) */
      setupGridBots({ showBots: false, showSlots: false });
      setInstruction("");
      /* LaserMachine.webp as tutorial overlay; LaserMachineWithoutLines stays as base */
      els.tutorialOverlay.classList.add("show");
      els.machineBlock.innerHTML = "";
      els.machineBlock.appendChild(makeBlock(r, TUT_BLOCK, TUT_BLOCK));
      els.blockCover.style.width = (TUT_BLOCK + 22) + "px";
      els.blockCover.style.height = (TUT_BLOCK + 22) + "px";
      els.blockCover.style.borderRadius = (r.name === "circle" ? "50%" : "18px");
      els.blockCover.style.opacity = "1";
      els.cutLine.style.width = (TUT_BLOCK + 12) + "px";
      els.cutLine.style.height = (TUT_BLOCK + 12) + "px";
      els.cutLine.style.borderRadius = (r.name === "circle" ? "50%" : "0");
      els.cutLine.classList.remove("show");
      els.wrongSlash.style.width = els.blockCover.style.width;
      els.wrongSlash.style.height = els.blockCover.style.height;
      els.wrongSlash.style.borderRadius = els.blockCover.style.borderRadius;
      state.orbitActive = true;
      snapLaser(TUTORIAL_START_ANGLE);
      showLaserHead();
      [els.bubbleLeft, els.bubbleRight, els.bubbleCut].forEach(function (el) {
        el.classList.add("fade");
      });
      els.cutOverlay.classList.remove("show");
      els.hitLeft.disabled = true;
      els.hitRight.disabled = true;
      els.hitCut.disabled = true;
      show(els.machineStage);
      later(function () {
        if (state.tutActive && state.tutStep === -1) {
          tutSetStep(0);
        }
      }, 900);
    }

    function tutSetStep(n) {
      state.tutStep = n;
      var t = TUT[n];
      setInstruction("");
      els.bots.className = "layout-clear";
      els.cutOverlay.classList.remove("show");

      els.btnLeft.classList.remove("tut-highlight", "tut-disabled");
      els.btnRight.classList.remove("tut-highlight", "tut-disabled");
      els.btnCut.classList.remove("tut-highlight", "tut-disabled");

      if (t.bubble === "left") {
        els.bubbleLeft.classList.remove("fade");
        els.btnLeft.classList.add("tut-highlight");
        if (!state.tutMoveVOPlayed) { playInstructionAudio("Tap to move."); state.tutMoveVOPlayed = true; }
      }
      if (t.bubble === "right") {
        els.bubbleRight.classList.remove("fade");
        els.btnRight.classList.add("tut-highlight");
        if (!state.tutMoveVOPlayed) { playInstructionAudio("Tap to move."); state.tutMoveVOPlayed = true; }
      }
      if (t.bubble === "cut") {
        els.bubbleCut.classList.remove("fade");
        els.btnCut.classList.add("tut-highlight");
        if (!state.tutCutVOPlayed) { playInstructionAudio("Tap to cut."); state.tutCutVOPlayed = true; }
      }
      /* Grey out the two buttons that aren't the prompted one. */
      [els.btnLeft, els.btnRight, els.btnCut].forEach(function (b) {
        if (!b.classList.contains("tut-highlight")) { b.classList.add("tut-disabled"); }
      });

      els.hitLeft.disabled = (t.btn !== "left");
      els.hitRight.disabled = (t.btn !== "right");
      els.hitCut.disabled = (t.btn !== "cut");
    }

    function tutHandleRight() {
      var step = state.tutStep;
      if (!state.tutActive || state.locked) { return; }
      if (step < 0 || step >= TUT.length || TUT[step].btn !== "right") { return; }
      pressButton(els.hitRight);
      sndRotate();
      [els.bubbleLeft, els.bubbleRight, els.bubbleCut].forEach(function (el) { el.classList.add("fade"); });
      state.angle = normalizedAngle(state.angle - 45);
      updateLaser(); /* smooth orbital rotation — NO beam */
      els.hitLeft.disabled = true;
      els.hitRight.disabled = true;
      els.hitCut.disabled = true;
      later(function () { tutSetStep(step + 1); }, 520);
    }

    function tutHandleLeft() {
      var step = state.tutStep;
      if (!state.tutActive || state.locked) { return; }
      if (step < 0 || step >= TUT.length || TUT[step].btn !== "left") { return; }
      pressButton(els.hitLeft);
      sndRotate();
      [els.bubbleLeft, els.bubbleRight, els.bubbleCut].forEach(function (el) { el.classList.add("fade"); });
      state.angle = normalizedAngle(state.angle + 45);
      updateLaser(); /* smooth orbital rotation — NO beam */
      els.hitLeft.disabled = true;
      els.hitRight.disabled = true;
      els.hitCut.disabled = true;
      later(function () { tutSetStep(step + 1); }, 520);
    }

    function tutHandleCut() {
      var step = state.tutStep;
      if (!state.tutActive || state.locked) { return; }
      if (step < 0 || step >= TUT.length || TUT[step].btn !== "cut") { return; }
      state.locked = true;
      pressButton(els.hitCut);
      sndCut();
      [els.bubbleLeft, els.bubbleRight, els.bubbleCut].forEach(function (el) { el.classList.add("fade"); });
      /* Stop the prompt pulse the moment the cut fires — after the FINAL cut no
         tutSetStep follows to clear it, so it kept pulsating over the result. */
      [els.btnLeft, els.btnRight, els.btnCut].forEach(function (b) { b.classList.remove("tut-highlight"); });
      els.cutOverlay.classList.remove("show");
      els.hitLeft.disabled = true;
      els.hitRight.disabled = true;
      els.hitCut.disabled = true;
      showBeam(state.angle); /* Beam.svg fires on CUT */
      var isFinalCut = (step >= TUT.length - 1);
      later(function () {
        hideBeam();
        /* First cut (vertical) → two halves; final cut (horizontal) splits
           those halves into four equal quarters. */
        if (isFinalCut) { tutSplitGrid(); } else { tutSplitHalves(); }
      }, 950);
      if (!isFinalCut) {
        /* Keep the halves on screen — the next (horizontal) cut divides them. */
        later(function () {
          state.locked = false;
          tutSetStep(step + 1);
        }, 1900);
      } else {
        /* Final cut: hold the four equal parts on screen for a few seconds so the
           player can take in the result before moving to the Let's-play screen
           (the split lands at ~950ms, so this leaves ~2.8s of settled view). */
        later(function () {
          state.tutActive = false;
          lowerThemeAfterTutorial();
          nextStep();
        }, 3800);
      }
    }

    /* Vertical cut: whole tutorial block → two side-by-side halves. */
    function tutSplitHalves() {
      var r = currentRound();
      var hw = TUT_BLOCK / 2, gap = 6;
      var trans = "transform 0.45s cubic-bezier(.34,1.3,.64,1)";
      var container = document.createElement("div");
      container.style.cssText = "position:relative;width:" + TUT_BLOCK + "px;height:" + TUT_BLOCK + "px;";
      var left = makeBlock(r, hw, TUT_BLOCK);
      var right = makeBlock(r, hw, TUT_BLOCK);
      [left, right].forEach(function (p) {
        p.style.position = "absolute"; p.style.top = "0"; p.style.filter = "none"; p.style.borderRadius = "0";
      });
      left.style.left = "0"; right.style.left = hw + "px";
      container.appendChild(left); container.appendChild(right);
      els.machineBlock.innerHTML = "";
      els.machineBlock.appendChild(container);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          left.style.transition = right.style.transition = trans;
          left.style.transform = "translateX(-" + gap + "px)";
          right.style.transform = "translateX(" + gap + "px)";
        });
      });
    }

    /* Horizontal cut: the two halves → four equal quarters. The quarters start
       laid out exactly like the existing halves (vertical gap only), then the
       horizontal gap opens so it reads as a single new cut. */
    function tutSplitGrid() {
      var r = currentRound();
      var hw = TUT_BLOCK / 2, hh = TUT_BLOCK / 2, gap = 6;
      var trans = "transform 0.45s cubic-bezier(.34,1.3,.64,1)";
      var defs = [
        { x: 0, y: 0, tx: -gap, ty: -gap },   /* TL */
        { x: hw, y: 0, tx: gap, ty: -gap },   /* TR */
        { x: 0, y: hh, tx: -gap, ty: gap },   /* BL */
        { x: hw, y: hh, tx: gap, ty: gap }    /* BR */
      ];
      var container = document.createElement("div");
      container.style.cssText = "position:relative;width:" + TUT_BLOCK + "px;height:" + TUT_BLOCK + "px;";
      var pieces = defs.map(function (d) {
        var p = makeBlock(r, hw, hh);
        p.style.position = "absolute"; p.style.left = d.x + "px"; p.style.top = d.y + "px";
        p.style.filter = "none"; p.style.borderRadius = "0";
        /* Match the current halves: horizontal gap already applied, no vertical gap yet. */
        p.style.transform = "translate(" + d.tx + "px,0px)";
        container.appendChild(p);
        return p;
      });
      els.machineBlock.innerHTML = "";
      els.machineBlock.appendChild(container);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          pieces.forEach(function (p, i) {
            p.style.transition = trans;
            p.style.transform = "translate(" + defs[i].tx + "px," + defs[i].ty + "px)";
          });
        });
      });
    }

    /* Point #iraChar at one of the two Ira clips. WebM (VP9 alpha → transparent
       cut-out) is listed first and preferred; the browser auto-falls-back to the
       MP4 <source> if the .webm isn't present (the MP4 has no alpha, so it shows
       its baked background — drop the .webm files in for the clean cut-out).
       Rebuilding the <source>s + load() is the multi-format way to swap clips. */
    function setIraClip(base) {
      els.iraChar.innerHTML =
        '<source src="' + ASSETS + base + '.webm" type="video/webm">' +

    function setupPreplay(text) {
      state.locked = false;
      setInstruction("");
      setupBots("layout-clear");
      els.playBg.src = ASSETS + "LetsPlayBg.webp";
      els.playButtonImg.src = ASSETS + "play.webp";   /* dedicated play glyph — the start screen keeps Button.webp */

      els.iraChar.classList.remove("play-idle");
      els.iraChar.loop = false;
      state.iraTalking = false;   /* once-guard for Phase 2 (ended event + fallback) */
      els.iraChar.style.transition = "none";
      els.iraChar.style.transform = "translateX(1200px) scaleX(-1)";   /* parked off-screen right, mirrored */
      els.iraGlowRing.classList.remove("show");

      function revealPlayButton() {
        /* Clear the slide transition; Ira keeps her mirrored resting transform
           (translateX(0) scaleX(-1)) and rests on IraVid2's final frame — so
           DON'T add .play-idle (its CSS breath would fight the video /
           un-mirror her). */
        els.iraChar.style.transition = "";
        els.playButton.style.opacity = "1";
        els.playButton.style.transform = "scale(1) translateY(0)";
        els.playButton.classList.add("play-ready");
      }

      function startPreplaySequence() {
        // Guard against state changes that may have occurred while we waited
        // for the new background to finish decoding.
        if (FLOW[state.step] && FLOW[state.step].scene !== "preplay") { return; }
        show(els.playStage);

        // Phase 2 — arrival / talking: Ira stands and points (IraVid2, played
        // ONCE — it rests on its final frame rather than looping), the glow ring
        // comes up, then the existing VO chain plays. Runs once, whichever fires
        // first: the arrival timer or IraVid1's "ended" event.
        function startTalking() {
          if (state.iraTalking) { return; }
          if (FLOW[state.step] && FLOW[state.step].scene !== "preplay") { return; }
          state.iraTalking = true;
          els.iraChar.onended = null;
          els.iraChar.loop = false;
          setIraClip("IraVid2");
          els.iraChar.play().catch(function () { });
          els.iraGlowRing.classList.add("show");
          var first = playInstructionAudio("You are all set.");
          whenInstructionAudioEnds(first, function () {
            var second = playInstructionAudio("Let's play.");
            whenInstructionAudioEnds(second, function () {
              revealPlayButton();
            });
          });
        }

        // Phase 1 — entrance: Ira runs in (IraVid1), sliding from off-screen right
        // to her resting spot over 3.4s, KEEPING the mirror.
        els.iraChar.loop = false;
        setIraClip("IraVid1");
        els.iraChar.currentTime = 0;
        els.iraChar.play().catch(function () { });
        els.iraChar.onended = startTalking;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            els.iraChar.style.transition = "transform 3.4s cubic-bezier(0.22, 0.8, 0.3, 1)";
            els.iraChar.style.transform = "translateX(0) scaleX(-1)";
          });
        });
        // Trim the run at slide-arrival (the transform lands at 3.4s): switch to
        // the talking clip the moment Ira stops moving, so she never runs in
        // place. Also doubles as the fallback if the "ended" event is missed.
        later(startTalking, 3400);
      }

      // Wait for the new LetsPlayBG.webp to finish decoding before unhiding the
      // stage; otherwise the <img> keeps painting the previously-decoded
      // GameStartScreen.webp for a frame, flashing the start screen.
      if (typeof els.playBg.decode === "function") {
        els.playBg.decode().then(startPreplaySequence, startPreplaySequence);
      } else {
        startPreplaySequence();
      }
    }
