<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerUp Bots </title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d9e7ff;
      display: flex;
      align-items: center;
      justify-content: center
    }

    button {
      font: inherit
    }

    #game {
      position: absolute;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      transform-origin: top left;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      color: #154aa5;
      user-select: none;
      background: #d9e7ff;
      isolation: isolate;
      --ease-in-out-soft: cubic-bezier(.65, 0, .35, 1);
      --ease-out-back: cubic-bezier(.18, .89, .32, 1.18);
      --ease-snap: cubic-bezier(.16, 1.18, .3, 1);
    }

    /* Screen transition fade overlay removed; it caused a visible white flash. */

    /* ── Lab-gate intro ──
       LabGate.webp split across two 50%-wide halves that part left/right. The
       image (2762×1732, ~1.6:1) is scaled by WIDTH (background-size 200% auto →
       full image spans both halves) and centred vertically, so it covers the
       whole 16:9 frame with no distortion — only a little top/bottom crop.
       Sits above everything, never takes input; JS parts the doors then drops it. */
    #labGate {
      position: absolute;
      inset: 0;
      z-index: 200;
      overflow: hidden;
      pointer-events: none;
      display: none;
      /* shown only while the transition runs (.gate-active) */
    }

    #labGate.gate-active {
      display: block;
    }

    .gate-half {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      background-image: url("assets/LabGate.webp");
      background-size: 200% auto;
      /* full image across both halves; cover width */
      background-repeat: no-repeat;
      will-change: transform;
      transition: transform 1.5s var(--ease-in-out-soft);
    }

    .gate-left {
      left: 0;
      background-position: left center;
    }

    .gate-right {
      right: 0;
      background-position: right center;
    }

    #labGate.gate-open .gate-left {
      transform: translateX(-100%);
    }

    #labGate.gate-open .gate-right {
      transform: translateX(100%);
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    /* Dim overlay that spotlights the block + hollows on the teaching screens
       (Figma 11:1819). Sits above the bg (z0) but below the corner hollows
       (z3) and the centre block (#shapeStage z12), so those pop while the
       background recedes. Fades in only on the screens that opt in. */
    #focusDim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.20);
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    #focusDim.show {
      opacity: 1;
    }

    .hidden {
      opacity: 0;
      pointer-events: none
    }

    #instruction {
      position: absolute;
      top: 8px;
      left: 32px;
      width: 1120px;
      height: 150px;
      z-index: 40;
      transition: opacity .28s ease, transform .28s ease;
    }

    #instruction {
      filter: drop-shadow(0 10px 16px rgba(77, 151, 220, .12));
    }

    #instruction.hidden {
      transform: translateY(-8px)
    }

    #game.teaching-active #instruction {
      opacity: 0 !important;
      pointer-events: none;
      visibility: hidden;
    }

    #instruction img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #instructionText {
      position: absolute;
      left: 154px;
      right: 14px;
      top: 42px;
      min-height: 58px;
      display: flex;
      align-items: center;
      color: #154aa5;
      font-size: 26px;
      line-height: 1.14;
      font-weight: 900;
      letter-spacing: 0;
    }

    /* Entrance: the face box fades in first, then the bubble unrolls to the right
       and the text fades in — added in setInstruction only on a fresh appear. */
    #instruction.intro-reveal img {
      animation: instrUnroll .6s cubic-bezier(.22, 1, .36, 1) both;
    }

    #instruction.intro-reveal #instructionText {
      animation: instrTextIn .5s ease .3s both;
    }

    @keyframes instrUnroll {
      0% {
        clip-path: inset(0 88% 0 0);
      }

      32% {
        clip-path: inset(0 88% 0 0);
      }

      /* hold on the face box only (left ~12%) */
      100% {
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes instrTextIn {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    #scene {
      position: absolute;
      inset: 0;
      z-index: 5;
    }

    .bot-slot {
      position: absolute;
      width: 260px;
      height: 520px;
      transform-origin: bottom center;
      /* Above #podConnectors (z4): the celebrate-jump transform makes each slot a
         stacking context, and without a z-index it would drop BEHIND the connector
         SVG mid-jump — so the wires/dots would render on top of the bots. */
      z-index: 6;
    }

    .bot-slot::after {
      content: "";
      position: absolute;
      left: 50%;
      top: var(--power-spark-top, 510px);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.35);
      opacity: 0;
      background: radial-gradient(circle, #fff 0 18%, #8af3ff 32%, rgba(114, 219, 255, 0) 72%);
      box-shadow: 0 0 0 rgba(116, 219, 255, 0);
      pointer-events: none;
      z-index: 12;
    }

    .layout-ready.power-connecting .bot-slot::after {
      animation: connectionFlash .66s cubic-bezier(.18, .89, .32, 1.18) 1.58s both;
    }

    .layout-ready.power-connecting .right-bot::after {
      animation-delay: 1.75s;
    }

    .bot-img {
      position: absolute;
      left: 50%;
      bottom: 0;
      max-width: none;
      object-fit: contain;
      transform: translateX(-50%);
      transition: filter .35s ease, transform .45s cubic-bezier(.18, .89, .35, 1.18);
      z-index: 8;
      will-change: transform, filter;
      backface-visibility: hidden;
    }

    .bot-img.happy {
      filter: drop-shadow(0 0 16px rgba(116, 219, 255, .95));
    }

    .bot-slot.celebrate-jump {
      animation: botSlotCelebrateJump .72s ease-in-out 2;
    }

    .layout-ready.power-connecting .bot-img {
      animation: botPowerNotice 2.7s cubic-bezier(.65, 0, .35, 1) .92s both;
    }

    .layout-ready.power-connecting .right-bot .bot-img {
      animation-delay: 1.06s;
    }

    .electric-pulse {
      position: absolute;
      left: 50%;
      top: 150px;
      width: 4px;
      height: 40px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 0 16px 6px #74dbff;
      transform: translateX(-50%);
      animation: pulseDown 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      z-index: 10;
    }

    @keyframes pulseDown {
      0% {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      80% {
        transform: translate(-50%, 380px);
        opacity: 1;
      }

      100% {
        transform: translate(-50%, 380px);
        opacity: 0;
      }
    }

    @keyframes botSlotCelebrateJump {

      0%,
      100% {
        transform: translateY(0);
      }

      42% {
        transform: translateY(-14px);
      }
    }

    @keyframes botPowerNotice {

      0%,
      38%,
      100% {
        transform: translateX(-50%) translateY(0) scale(1);
        filter: none;
      }

      48% {
        transform: translateX(-50%) translateY(-5px) scale(1.018);
        filter: drop-shadow(0 0 10px rgba(116, 219, 255, .55));
      }

      59% {
        transform: translateX(-50%) translateY(1px) scale(.996);
      }
    }

    @keyframes connectionFlash {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
        box-shadow: 0 0 0 rgba(116, 219, 255, 0);
      }

      42% {
        opacity: .95;
        transform: translate(-50%, -50%) scale(1.2);
        box-shadow: 0 0 22px 10px rgba(116, 219, 255, .42);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.9);
        box-shadow: 0 0 36px 18px rgba(116, 219, 255, 0);
      }
    }

    .pod-img {
      position: absolute;
      left: 50%;
      top: 0;
      width: 134px;
      height: auto;
      transform: translateX(-50%);
      object-fit: contain;
      opacity: 0;
      transition: opacity .35s ease, filter .35s ease;
      z-index: 4;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .pod-img.visible {
      opacity: 1
    }

    .pod-img.glow {
      animation: podGlow 1s ease-in-out 2
    }

    .pod-img.front-layer {
      z-index: 60;
    }

    .pod-connector-neck-cover {
      position: absolute;
      left: 50%;
      width: var(--connector-cover-w, 20px);
      height: var(--connector-cover-h, 15px);
      transform: translateX(-50%);
      border-radius: 10px 10px 5px 5px;
      background:
        linear-gradient(90deg,
          rgba(213, 235, 255, .98) 0%,
          rgba(247, 253, 255, .98) 48%,
          rgba(197, 225, 249, .98) 100%);
      border: 1px solid rgba(126, 179, 214, .66);
      box-shadow:
        inset 0 1px 3px rgba(255, 255, 255, .82),
        inset 0 -2px 4px rgba(126, 179, 214, .28),
        0 0 4px rgba(56, 172, 223, .22);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .pod-connector-neck-cover::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -10px;
      width: 5px;
      height: 18px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, #153d72 0%, #2e5d96 48%, #123866 100%);
      box-shadow: 0 0 2px rgba(74, 170, 240, .26);
    }

    .pod-connector-neck-cover.visible {
      opacity: 1;
    }

    /* Charging connector clamped onto each bot head when the circuit energises
       (charging screen only). Built entirely in CSS/SVG — no image asset. A
       compact white cap with a blue top knob (where the wire meets) and a cyan
       lightning outline — no face/visor, so it reads as a plug on the crown.
       Appended into each .bot-slot by seatHeadPlug(); removed in resetScene(). */
    .head-plug {
      position: absolute;
      left: 50%;
      bottom: 216px;
      /* calibrated for the charge ("plug") screen bots */
      width: 96px;
      height: 64px;
      transform: translateX(-50%) scale(.44);
      transform-origin: 50% 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 9;
      filter: drop-shadow(0 5px 7px rgba(20, 70, 120, .3));
    }

    /* Success/grid-fit screen uses different-sized bots, so the plug seats lower
       to rest on those heads (the charge-screen 216px floats above them). Raised
       to 202px so the plug crown follows the wire heads (now landed at ~0.52 of
       the bot height) — keeps the bead seated on the plug. Charge screen uses the
       base .head-plug (216px) and is unaffected. */
    .head-plug.seat-success {
      bottom: 202px;
    }

    .head-plug.connected {
      animation: headPlugConnect .5s cubic-bezier(.2, 1.25, .4, 1) both;
    }

    @keyframes headPlugConnect {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(-12px) scale(.3);
      }

      62% {
        opacity: 1;
        transform: translateX(-50%) translateY(2px) scale(.5);
      }

      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(.44);
      }
    }

    .head-plug .hp-knob {
      position: absolute;
      left: 50%;
      top: 0;
      width: 22px;
      height: 19px;
      transform: translateX(-50%);
      border-radius: 7px 7px 5px 5px;
      background: linear-gradient(180deg, #6cd9f7 0%, #34c0f2 58%, #15a4dd 100%);
      box-shadow:
        inset 0 2px 2px rgba(255, 255, 255, .55),
        inset 0 -3px 4px rgba(8, 92, 142, .42);
      z-index: 1;
    }

    .head-plug .hp-body {
      position: absolute;
      left: 0;
      top: 12px;
      width: 100%;
      height: 52px;
      border-radius: 30px 30px 24px 24px;
      background: linear-gradient(180deg, #ffffff 0%, #f2faff 55%, #e6f2fb 100%);
      box-shadow:
        inset 0 3px 4px rgba(255, 255, 255, .92),
        inset 0 -5px 8px rgba(150, 190, 220, .38);
      z-index: 2;
    }

    .head-plug .hp-bolt {
      position: absolute;
      left: 50%;
      top: 24px;
      width: 21px;
      height: 28px;
      transform: translateX(-50%);
      z-index: 3;
    }

    @keyframes podGlow {

      0%,
      100% {
        filter: brightness(1)
      }

      50% {
        filter: brightness(1.55) saturate(1.75) drop-shadow(0 0 16px rgba(76, 222, 255, .9))
      }
    }

    .layout-intro .left-bot {
      left: 360px;
      bottom: 0
    }

    .layout-intro .right-bot {
      right: 360px;
      bottom: 0
    }

    .layout-intro .bot-img {
      width: 205px
    }

    .layout-intro .pod-img {
      display: none
    }

    /* ── 4-bot screens (intro + corner-hollow) ── */
    /* Mid bots exist only for the 4-bot screens; hidden in every other layout. */
    .mid-left-bot,
    .mid-right-bot {
      display: none;
    }

    /* 4 bots in a centered row, sized ~134px per reference image 1 */
    .layout-intro4 .bot-slot,
    .layout-corners4 .bot-slot {
      display: block;
      bottom: 0;
    }

    .layout-intro4 .left-bot,
    .layout-corners4 .left-bot {
      left: 246px;
      right: auto;
    }

    .layout-intro4 .mid-left-bot,
    .layout-corners4 .mid-left-bot {
      left: 422px;
      right: auto;
    }

    .layout-intro4 .mid-right-bot,
    .layout-corners4 .mid-right-bot {
      right: 422px;
      left: auto;
    }

    .layout-intro4 .right-bot,
    .layout-corners4 .right-bot {
      right: 246px;
      left: auto;
    }

    .layout-intro4 .bot-img,
    .layout-corners4 .bot-img {
      width: 134px;
      bottom: 40px;
    }

    .layout-intro4 .pod-img,
    .layout-intro4 .target-fill,
    .layout-corners4 .pod-img,
    .layout-corners4 .target-fill {
      display: none;
    }

    /* 4 square hollows that pop into the corners on the plug screen */
    #cornerSlots {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    #cornerSlots.hidden {
      display: none;
    }

    /* Glowing wires from corner pods to bot heads (grid round, pod screen). */
    #podConnectors {
      position: absolute;
      inset: 0;
      width: 1280px;
      height: 720px;
      z-index: 4;
      pointer-events: none;
      overflow: visible;
    }

    #podConnectors.hidden {
      display: none;
    }

    #podConnectors path {
      fill: none;
      stroke: #7ff8ff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter:
        drop-shadow(0 0 4px rgba(127, 248, 255, .95)) drop-shadow(0 0 10px rgba(0, 224, 255, .8)) drop-shadow(0 0 22px rgba(0, 200, 255, .45));
      stroke-dasharray: var(--len);
      stroke-dashoffset: var(--len);
      /* draw in over 1s, ease-out; per-wire stagger set inline in JS */
      animation: podWireDraw 1s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes podWireDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    #podConnectors .pod-wire-node {
      fill: #eaffff;
      filter: drop-shadow(0 0 6px rgba(127, 248, 255, .95));
    }

    /* Travelling electricity bead that rides each wire (SVG animateMotion). */
    #podConnectors .pod-energy {
      fill: #ffffff;
      opacity: 0;
      filter:
        drop-shadow(0 0 5px rgba(255, 255, 255, .95)) drop-shadow(0 0 12px rgba(127, 248, 255, .95)) drop-shadow(0 0 22px rgba(0, 224, 255, .7));
      animation: podEnergyAppear .3s ease forwards;
    }

    @keyframes podEnergyAppear {
      to {
        opacity: 1;
      }
    }

    /* Bots glow softly once the circuit energises (~2s). */
    .bot-img.pod-charged-glow {
      filter: drop-shadow(0 0 14px rgba(127, 248, 255, .8)) drop-shadow(0 0 26px rgba(0, 200, 255, .4));
      transition: filter .5s ease;
    }

    /* Purple light-cone spotlight over the bots (charge / pods screens only). */
    #botSpotlight {
      position: absolute;
      left: 50%;
      top: -30px;
      width: 860px;
      height: 770px;
      transform: translateX(-50%);
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity .45s ease;
    }

    #botSpotlight.show {
      opacity: 1;
    }

    /* Charge-beam "power on": the cone flashes brighter, then settles to its
       steady glow. Base transform is preserved so it doesn't jump off-centre. */
    #botSpotlight.charge-flash {
      animation: chargeBeamFlash 1s ease-out forwards;
    }

    @keyframes chargeBeamFlash {
      0% {
        opacity: 0;
        transform: translateX(-50%) scaleY(.92);
        filter: brightness(1.6);
      }

      22% {
        opacity: 1;
        transform: translateX(-50%) scaleY(1.04);
        filter: brightness(2);
      }

      55% {
        opacity: .9;
        transform: translateX(-50%) scaleY(.99);
        filter: brightness(1.25);
      }

      100% {
        opacity: 1;
        transform: translateX(-50%) scaleY(1);
        filter: brightness(1);
      }
    }

    /* The cone itself — Figma settings ported to reliable CSS:
       fill rgba(228,170,253,.28), layer opacity .5, backdrop blur.
       Trapezoid (narrow top → wide bottom) via clip-path; blur scaled from
       Figma's 250.8px over its 1230px frame to this 860px element (~175px). */
    #botSpotlight .cone {
      position: absolute;
      inset: 0;
      opacity: 0.5;
      background: rgba(239, 201, 255, 0.49);
      /* Figma 43:469 fill #EFC9FF @ .49 */
      -webkit-backdrop-filter: blur(175px);
      backdrop-filter: blur(175px);
      clip-path: polygon(23.6% 0%, 74.8% 0%, 98.6% 100%, 1.3% 100%);
    }

    .corner-slot {
      position: absolute;
      width: 170px;
      height: auto;
      opacity: 0;
      transform: rotate(var(--cs-rot, 0deg)) scale(.7);
      transition: opacity .4s ease, transform .45s var(--ease-out-back);
    }

    .corner-slot.show {
      opacity: 1;
      transform: rotate(var(--cs-rot, 0deg)) scale(1);
    }

    /* Hollow highlight — cyan pulse (slotInstruct). A frame whose stroke sits
       on the pod art's own outline (flightLayer ghost, since the
       slot art is an <img> and can't host children): faint lit interior +
       bright rim, breathing. Box-shaped cavities (square / rect /
       quarter-circle via border-radius) use the real border + inset glows;
       the triangle rounds use the SVG-stroke variant below — borders and
       box-shadows can't follow a clip-path edge.
       NB: class + keyframes are deliberately distinct from the in-pod
       .pod-hollow-focus-frame / podHollowCyanPulse (tap flow) — that variant
       centres itself with translateX(-50%), which would drag this absolutely
       positioned ghost half a frame off its slot. */
    .pod-cavity-focus-frame {
      position: absolute;
      border: 4px solid #2fffff;
      box-sizing: border-box;
      pointer-events: none;
      opacity: .92;
      background: rgba(47, 255, 255, .10);
      box-shadow:
        inset 0 0 0 2px rgba(218, 255, 255, .66),
        inset 0 0 18px 5px rgba(47, 255, 255, .5),
        inset 0 0 12px rgba(47, 255, 255, .38);
      animation: podCavityCyanPulse 1.08s ease-in-out infinite;
      transform-origin: center center;
      will-change: opacity, transform, box-shadow;
    }

    @keyframes podCavityCyanPulse {

      0%,
      100% {
        opacity: .76;
        transform: scale(.97);
        box-shadow:
          inset 0 0 0 1px rgba(218, 255, 255, .46),
          inset 0 0 14px 4px rgba(47, 255, 255, .44),
          inset 0 0 10px rgba(47, 255, 255, .3);
      }

      50% {
        opacity: 1;
        transform: scale(1);
        box-shadow:
          inset 0 0 0 3px rgba(230, 255, 255, .82),
          inset 0 0 22px 7px rgba(47, 255, 255, .7),
          inset 0 0 18px rgba(47, 255, 255, .54);
      }
    }

    /* Triangle-cavity variant: an SVG polygon traces the exact cavity edges
       (fill = lit interior, stroke = rim), drop-shadows stand in for the
       inset glows. Same breath as the frame. */
    .pod-hollow-focus-tri {
      position: absolute;
      pointer-events: none;
      overflow: visible;
      filter:
        drop-shadow(0 0 6px rgba(47, 255, 255, .6)) drop-shadow(0 0 14px rgba(47, 255, 255, .4));
      animation: podHollowTriPulse 1.08s ease-in-out infinite;
      transform-origin: center center;
      will-change: opacity, transform;
    }

    @keyframes podHollowTriPulse {

      0%,
      100% {
        opacity: .76;
        transform: scale(.97);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Fixed position that always clears the instruction panel (panel ends
       ≈y183), whether or not the panel is showing — so the upper hollows never
       shift as it appears/disappears. */
    .cs-tl {
      left: 90px;
      top: 202px;
    }

    .cs-tr {
      right: 90px;
      top: 202px;
    }

    /* Cutting/laser screen has no instruction panel, so the top hollows sit
       higher there (per Figma node 11:1948, hollow centre ≈ y140 → top 84). */
    #cornerSlots.slots-high .cs-tl,
    #cornerSlots.slots-high .cs-tr {
      top: 84px;
    }

    .cs-bl {
      left: 90px;
      bottom: 95px;
    }

    .cs-br {
      right: 90px;
      bottom: 95px;
    }

    /* Plug/charging connector screen (Figma 16:2094): all four hollows sit
       higher — uppers near the top, lowers level with the bots' upper bodies. */
    #cornerSlots.slots-connector .cs-tl,
    #cornerSlots.slots-connector .cs-tr {
      top: 109px;
    }

    #cornerSlots.slots-connector .cs-bl,
    #cornerSlots.slots-connector .cs-br {
      bottom: 114px;
    }

    /* Fit/success screen reuses slots-connector but ALSO shows the instruction
       panel (panel bottom ≈y158). Drop only the upper hollows so they clear it;
       the seated blocks + top wires follow (both computed from live slot
       centres). The real plug screen has slots-connector WITHOUT slots-fit, so

    /* Guided slot preview: each half travels to the hollow, snaps back faster,
       then finishes with one final move into the hollow. The dotted SVG path mirrors
       the sampled Bezier points so the motion and visual cue agree. */

      13% {

      19% {

      }

      27% {
        transform: translate(var(--p62x), var(--p62y)) scale(.82);

      }

      35% {
        transform: translate(var(--p82x), var(--p82y)) scale(calc(var(--slotScale, .68) + .04));

      42% {
        transform: translate(var(--tx), var(--ty)) scale(var(--slotScale, .68));

      49% {
        transform: translate(var(--tx), var(--ty)) scale(var(--slotScale, .68));
        opacity: 1;
      }

      54% {
        transform: translate(var(--p82x), var(--p82y)) scale(calc(var(--slotScale, .68) + .04));

      }

      58% {
        transform: translate(var(--p62x), var(--p62y)) scale(.82);

      }

      62% {
        transform: translate(var(--p38x), var(--p38y)) scale(.91);

      78% {

      }

      86% {

      }

      }

    .teach-frame {
      width: 1100px;
      height: 560px;
      display: flex;
      align-items: stretch;
      padding: 50px;
      gap: 50px;
      box-sizing: border-box;
      position: relative;

      /* Neon panel drawn in pure CSS (vector) so the border stays razor-sharp
         at every viewport scale and DPI. It previously used a 2542x1522
         TeachingScreen.webp stretched to 1100x560, then upscaled again by the
         #game transform — a double resample that softened the thin neon line
         and read as "not smooth" on load. Vector has no resample, no decode. */
      background:
        radial-gradient(120% 120% at 50% 42%, rgba(60, 140, 210, .45) 0%, rgba(20, 70, 125, 0) 60%),
        repeating-linear-gradient(0deg, rgba(150, 200, 255, .09) 0 1px, transparent 1px 23px),
        repeating-linear-gradient(90deg, rgba(150, 200, 255, .09) 0 1px, transparent 1px 23px),

        0 0 7px 2px rgba(120, 225, 255, .85) inset,
        0 0 22px 4px rgba(70, 150, 255, .30) inset;

      mask-composite: exclude;

    }

    /* Sits flush to the right of the Cut button (Cut spans x:382-518 in the machine stage);
       the panel's tail is on its left edge so it points back at the button.
       Top chosen so the tail tip lines up with the button's vertical centre (y≈654). */
    #bubbleCut {
      width: 240px;
      height: 78px;
      /* 240 × 172/532 */
      left: 545px;
      top: 614px;
      background-image: url("assets/cutPanelsvg.svg");
    }

    #bubbleCut .tb-text {
      inset: 0 0 0 28px;
      /* body starts right of the 63/532 tail strip */
    }

    .tutorial-bubble.fade {
      opacity: 0;
      transform: translateY(8px)
    }

    #flightLayer {
      position: absolute;
      inset: 0;
      z-index: 55;
      pointer-events: none;
    }

    .flying-half {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .9s cubic-bezier(.18, .89, .32, 1.08), opacity .9s ease;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .flying-half.wrong-slot-piece {
      z-index: 62;
    }

    .flying-half.soft-mismatch {
      animation: softMismatch .56s cubic-bezier(.36, 0, .66, -0.56) 2;
      filter: drop-shadow(0 0 12px rgba(120, 219, 255, .5)) saturate(1.06);
    }

    @keyframes softMismatch {

      0%,
      100% {
        transform: var(--fit-transform);
      }

      22% {
        transform: var(--fit-transform) translateX(-6px) rotate(-2deg);
      }

      48% {
        transform: var(--fit-transform) translateX(5px) rotate(1.7deg);
      }

      72% {
        transform: var(--fit-transform) translateX(-3px) rotate(-1deg);
      }
    }

    .fit-piece {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      position: relative;
      z-index: 1;
    }

    #tryAgain,
    #nextButton {
      position: absolute;
      left: 50%;
      bottom: 4px;
      width: 168px;
      height: auto;
      transform: translateX(-50%);
      border: 0;
      background: transparent;
      z-index: 70;
      cursor: pointer;
      transition: opacity .22s ease, transform .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #tryAgain {
      bottom: 310px;
      width: 220px;
    }

    #tryAgain:hover,
    #nextButton:hover {
      filter: drop-shadow(0 0 14px rgba(116, 219, 255, .78)) brightness(1.06);
      transform: translateX(-50%) scale(1.035);
    }

    #tryAgain img,
    #nextButton img {
      display: block;
      width: 100%;
      height: auto
    }

    /* ── Code-built glossy ORANGE circular "Next" button (pure HTML+CSS, no image) ──
       Cream rim (wrapper bg + padding) → orange gradient body (golden top, deep
       orange bottom) with an upper-left gloss → a bold rounded white right-arrow.
       Replaces NextButton2.webp; shown only in the success (.is-success) state. */
    #nextButton .next-play {
      display: none;
    }

    #nextButton.is-success img {
      display: none;
    }

    #nextButton.is-success .next-play {
      display: block;
    }

    .next-play {
      --rim: 7%;
      /* cream rim thickness */
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      box-sizing: border-box;
      padding: var(--rim);
      border-radius: 50%;
      background: linear-gradient(180deg, #fff6e4 0%, #ffe7bd 100%);
      box-shadow: 0 7px 15px rgba(190, 90, 0, .38), 0 2px 5px rgba(190, 90, 0, .28);
    }

    /* orange body: golden top → deep orange bottom, with rim-light + base shadow */
    .np-body {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffd23d 0%, #ffae22 46%, #f4790a 100%);
      box-shadow: inset 0 -9px 16px rgba(178, 74, 0, .5), inset 0 7px 12px rgba(255, 240, 185, .55);
      overflow: hidden;
    }

    /* glossy upper-left highlight */
    .np-body::before {
      content: "";
      position: absolute;
      left: 12%;
      top: 7%;
      width: 64%;
      height: 44%;
      border-radius: 50%;
      background: radial-gradient(58% 68% at 42% 36%, rgba(255, 255, 255, .92), rgba(255, 255, 255, 0) 70%);
    }

    /* bold rounded white right-arrow (filled + round-joined for soft ends) */
    .np-arrow {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 1px rgba(170, 78, 0, .35));
    }

    /* press compress */
    #nextButton.is-success:active .next-play {
      box-shadow: 0 3px 7px rgba(190, 90, 0, .35);
    }

    #tryAgain:not(.hidden) {
      animation: tryAgainPulse 1.6s ease-in-out infinite;
    }

    @keyframes tryAgainPulse {

      0%,
      100% {
        transform: translateX(-50%) scale(1);
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, .8)) drop-shadow(0 0 18px rgba(255, 255, 255, .45));
      }

      50% {
        transform: translateX(-50%) scale(1.055);
        filter: drop-shadow(0 0 16px rgba(255, 255, 255, .95)) drop-shadow(0 0 32px rgba(255, 255, 255, .6));
      }
    }

    #tryAgain:active {
      transform: translateX(-50%) scale(.96)
    }

    #nextButton:active {
      opacity: .82;
      transform: translateX(-50%) scale(.96)
    }

    /* Success Next button sits on the right edge, vertically centred. Its own
       transform anchor is translateY(-50%) (not the base translateX), so its
       hover/active/pulse rules below re-state it to avoid snapping to centre. */
    #nextButton.is-success {
      left: auto;
      right: 16px;
      top: 50%;
      bottom: auto;
      width: 92px;
      transform: translateY(-50%);
      filter: drop-shadow(0 0 18px rgba(255, 176, 64, .8)) drop-shadow(0 8px 16px rgba(210, 110, 0, .45));
    }

    #nextButton.is-success:hover {
      transform: translateY(-50%) scale(1.035);
    }

    #nextButton.is-success:active {
      transform: translateY(-50%) scale(.96);
    }

    #nextButton.is-success:not(.hidden) {
      animation: nextSuccessPulse 1.6s ease-in-out infinite;
    }

    @keyframes nextSuccessPulse {

      0%,
      100% {
        filter: drop-shadow(0 0 18px rgba(255, 176, 64, .8)) drop-shadow(0 8px 16px rgba(210, 110, 0, .45));
        transform: translateY(-50%) scale(1);
      }

      50% {
        filter: drop-shadow(0 0 28px rgba(255, 198, 96, 1)) drop-shadow(0 0 44px rgba(230, 130, 10, .62));
        transform: translateY(-50%) scale(1.045);
      }
    }

    #completeStage {
      position: absolute;
      inset: 0;
      z-index: 60;
      overflow: hidden;
      isolation: isolate;
      background-color: #e6f0ff;
      background:
        radial-gradient(circle at 50% 40%, #ffffff 0 13%, #e5efff 35%, #c5daff 100%),
        linear-gradient(180deg, #e6f0ff 0%, #dbeaff 100%);
      transition: opacity .35s ease;
    }

    #completeStage::before {
      content: "";
      position: absolute;
      inset: -110px -180px -60px;
      background: repeating-conic-gradient(from -10deg at 50% 32%,
          rgba(255, 255, 255, .5) 0deg,
          rgba(255, 255, 255, .5) 8deg,
          rgba(170, 201, 255, .2) 8deg,
          rgba(170, 201, 255, .2) 18deg);
      opacity: .74;
      z-index: 0;
      pointer-events: none;
    }

    #completeStage::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 58px;
      height: 31px;
      background: rgba(86, 150, 244, .55);
      box-shadow: 0 -1px 0 rgba(255, 255, 255, .46), 0 6px 16px rgba(77, 136, 221, .2);
      z-index: 1;
    }

    .complete-copy {
      position: absolute;
      left: 50%;
      top: 54px;
      width: 640px;
      transform: translateX(-50%);
      text-align: center;
      color: #10295d;
      font-weight: 900;
      z-index: 6;
      text-shadow: 0 3px 0 rgba(255, 255, 255, .76), 0 6px 13px rgba(20, 50, 104, .16);
    }

    .complete-title {
      font-size: 56px;
      line-height: 1.04;
      letter-spacing: 0;
    }

    .complete-sub {
      margin-top: 12px;
      font-size: 32px;
      line-height: 1.1;
      color: #10295d;
    }

    .complete-bots {
      position: absolute;
      left: 50%;
      bottom: 80px;
      width: 940px;
      height: 392px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform: translateX(-50%);
      z-index: 3;
    }

    .complete-bot {
      position: relative;
      width: 260px;
      height: 372px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .complete-bot-img {
      display: block;
      width: var(--bot-w);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 16px 20px rgba(63, 96, 151, .2)) drop-shadow(0 0 22px rgba(86, 229, 255, .56));
      animation: completeBotBounce 1.6s ease-in-out infinite;
    }

    .complete-confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 5;
      pointer-events: none;
    }

    /* Round-win burst sits at #game level, so it needs to clear the fit screen's
       layers (machineStage/flightLayer z:50-55) to rain over the whole scene. */
    #winConfetti {
      z-index: 60;
    }

    #winConfetti.hidden {
      display: none;
    }

    .complete-confetti span {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w, 12px);
      height: var(--h, 28px);
      border-radius: 6px 6px 3px 3px;
      background: var(--c);
      opacity: 0;
      transform: translate3d(0, -80px, 0) rotate(var(--r));
      animation: completeConfettiFall var(--dur, 3.4s) linear infinite;
      animation-delay: var(--d);
    }

    .complete-ground-shadow {
      position: absolute;
      left: 50%;
      bottom: -2px;
      width: 150px;
      height: 18px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: rgba(47, 85, 144, .16);
      filter: blur(3px);
      z-index: -1;
    }

    @keyframes completeBotBounce {

      0%,
      100% {
        transform: translateY(0) rotate(0)
      }

      50% {
        transform: translateY(-10px) rotate(1.2deg)
      }
    }

    @keyframes completeConfettiFall {

      0% {
        opacity: 0;
        transform: translate3d(0, -100px, 0) rotate(var(--r))
      }

      10% {
        opacity: 1
      }

      92% {
        opacity: 1
      }

      100% {
        opacity: 0;
        transform: translate3d(var(--dx, 0px), var(--fall, 780px), 0) rotate(calc(var(--r) + var(--spin, 380deg)))
      }
    }

    /* ── Interactive kid-game animations ── */
    @keyframes piecePopIn {
      0% {
        opacity: 0;
        transform: scale(.45) rotate(-10deg)
      }

      65% {
        transform: scale(1.15) rotate(4deg)
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0)
      }
    }

    .teach-pop {
      animation: piecePopIn .4s cubic-bezier(.34, 1.5, .64, 1) both
    }

    .teach-pop-d1 {
      animation-delay: .16s
    }

    @keyframes sparkDot {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1)
      }

      100% {
        opacity: 0;
        transform: translate(var(--sx), var(--sy)) scale(0)
      }
    }

    .spark-dot {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkDot .75s ease-out both;
      will-change: transform, opacity;
    }

    @keyframes nextBtnPop {
      0% {
        opacity: 0;
        transform: translateX(-50%) scale(.2) rotate(-15deg)
      }

      60% {
        transform: translateX(-50%) scale(1.2) rotate(5deg)
      }

      80% {
        transform: translateX(-50%) scale(.94) rotate(-1deg)
      }

      100% {
        opacity: 1;
        transform: translateX(-50%) scale(1) rotate(0)
      }
    }

    @keyframes nextBtnGlow {

      0%,
      100% {
        filter: none
      }

      50% {
        filter: drop-shadow(0 0 14px rgba(116, 219, 255, .95)) brightness(1.12)
      }
    }

    #nextButton:not(.hidden) {
      animation: nextBtnPop .5s cubic-bezier(.34, 1.3, .64, 1) both,
        nextBtnGlow 1.4s ease-in-out .52s infinite;
    }

    @keyframes idleHintPulse {

      0%,
      100% {
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, .3));
        transform: scale(1);
      }

      50% {
        filter: drop-shadow(0 0 22px rgba(116, 219, 255, .95));
        transform: scale(1.14);
      }
    }

    #btnLeft.idle-hint {
      animation: idleHintPulse 1.4s ease-in-out infinite;
      z-index: 40;
    }

    #btnRight.idle-hint {
      animation: idleHintPulse 1.4s ease-in-out infinite;
      z-index: 40;
    }

    /* Idle HandNudge — a pointing hand that taps the correct button when the
       player sits idle. The art (309×230) points up with the fingertip ≈0.49w /
       0.48h in. NOTE: #handNudge lives inside #machineStage, which is 900px wide
       (not the 1280 frame), so these left/top are machineStage-local — the
       fingertip is anchored onto each button's centre at 150px wide. */
    #handNudge {
      position: absolute;
      width: 150px;
      height: auto;
      z-index: 46;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
    }

    #handNudge.show {
      opacity: 1;
    }

    #handNudge.nudge-left {
      left: 33px;
      top: 280px;
      animation: handNudgeTap 0.8s ease-in-out infinite alternate;
    }

    #handNudge.nudge-right {
      left: 721px;
      top: 280px;
      animation: handNudgeTap 0.8s ease-in-out infinite alternate;
    }

    #handNudge.nudge-cut {
      left: 377px;
      top: 586px;
      animation: handNudgeTap 0.8s ease-in-out infinite alternate;
    }

    @keyframes handNudgeTap {
      0% {
        transform: translateY(0) scale(1);
      }

      100% {
        transform: translateY(8px) scale(0.92);
      }
    }

    .wrong-fit-glow {
      filter: none !important;
    }

    .wrong-fit-hold {
      animation: none;
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body>
  <main id="game" aria-label="PowerUp Bots halves game">
    <img id="sceneBg" class="bg" src="assets/Mainbg.webp" alt="">
    <div id="focusDim" aria-hidden="true"></div>
    <div id="clueCard" class="teach-frame hidden" aria-hidden="true"></div>

    <section id="instruction" class="hidden" aria-live="polite">
      <img src="assets/instructionPannel.webp" alt="">
      <div id="instructionText"></div>
    </section>

    <section id="scene">
      <!-- Purple light-cone spotlight over the bots (charge / pods screens).
           Figma settings (fill rgba(228,170,253,.28), opacity .5, backdrop
           blur) ported to CSS in #botSpotlight .cone for reliable rendering. -->
      <div id="botSpotlight" aria-hidden="true">
        <div class="cone"></div>
      </div>
      <div id="bots" class="layout-intro">
        <div class="bot-slot left-bot">
          <div class="target-fill" id="leftFill"></div>
          <img class="pod-img" id="leftPod" src="assets/SquareHollow.webp" alt="">
          <img class="bot-img" id="leftBot" src="assets/SquareBotSadState.webp" alt="">
        </div>
        <div class="bot-slot right-bot">
          <div class="target-fill" id="rightFill"></div>
          <img class="pod-img" id="rightPod" src="assets/SquareHollow.webp" alt="">
          <img class="bot-img" id="rightBot" src="assets/SquareBotSadState.webp" alt="">
        </div>
        <div class="bot-slot mid-left-bot">
          <img class="bot-img" id="midLeftBot" src="assets/SquareBotSadState.webp" alt="">
        </div>
        <div class="bot-slot mid-right-bot">
          <img class="bot-img" id="midRightBot" src="assets/SquareBotSadState.webp" alt="">
        </div>
      </div>

      <div id="cornerSlots" class="hidden" aria-hidden="true">
        <img class="corner-slot cs-tl" src="assets/SquareHollow.webp" alt="">
        <img class="corner-slot cs-tr" src="assets/SquareHollow.webp" alt="">
        <img class="corner-slot cs-bl" src="assets/SquareHollow.webp" alt="">
        <img class="corner-slot cs-br" src="assets/SquareHollow.webp" alt="">
      </div>

      <svg id="podConnectors" class="hidden" viewBox="0 0 1280 720" aria-hidden="true"></svg>

      <div id="shapeStage" class="hidden" aria-hidden="true"></div>

      <div id="teachStage" class="hidden" aria-hidden="true">
        <div id="teachContent"></div>
      </div>

      <section id="playStage" class="hidden">
        <img id="playBg" src="assets/GameStartScreen.webp" alt="">
        <div id="playFx" aria-hidden="true"></div>
        <div id="iraGlowRing" aria-hidden="true"></div>
        <video id="iraChar" muted playsinline preload="auto" aria-hidden="true">
          <source src="assets/IraVid1.webm" type="video/webm">
          <source src="assets/IraVid1.mp4" type="video/mp4">
        </video>
        <button id="playButton" type="button" aria-label="Let's go">
          <img id="playButtonImg" src="assets/Button.webp" alt="Play">
        </button>
      </section>

      <div id="machineStage" class="hidden" aria-hidden="true">
        <!-- base machine (always LaserMachineWithoutLines) -->
        <img id="machineImg" src="assets/LaserMachineWithoutLines.webp" alt="">
        <!-- Inline LaserMachine.svg for the after-2-misses cut-line guide (hidden
             until .show). Inlined (not fetched) so the line elements are scriptable
             AND it works from file:// where fetch() is blocked. Lines are, in order:
             vertical, horizontal, slash(/), backslash(\) — see machineSvgLineIndexForAngle. -->
        <div id="machineSvgLayer" aria-hidden="true">
          <svg viewBox="0 0 830 835" fill="none" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
            <circle cx="414.654" cy="414.654" r="400.338" fill="#004E7C" />
            <circle cx="414.654" cy="414.654" r="369.717" fill="#DEF0FF" />
            <line x1="415.788" y1="44.9375" x2="415.788" y2="786.639" stroke="#7BAEFF" stroke-width="2.2682"
              stroke-dasharray="4.54 4.54" />
            <line x1="785.504" y1="416.921" x2="43.8021" y2="416.921" stroke="#7BAEFF" stroke-width="2.2682"
              stroke-dasharray="4.54 4.54" />
            <line x1="153.009" y1="679.739" x2="677.471" y2="155.277" stroke="#7BAEFF" stroke-width="2.2682"
              stroke-dasharray="4.54 4.54" />
            <line x1="152.345" y1="153.009" x2="676.807" y2="677.471" stroke="#7BAEFF" stroke-width="2.2682"
              stroke-dasharray="4.54 4.54" />
          </svg>
        </div>
        <!-- LaserMachine.svg overlay — tutorial guide lines only -->
        <img id="tutorialOverlay" src="assets/LaserMachine.svg" alt="" aria-hidden="true">
        <img id="guideLineHighlight" src="assets/LaserMachine.svg" alt="" aria-hidden="true">
        <!-- Beam.svg — hidden by default, only shown on CUT -->
        <img id="beamImg" src="assets/Beam.svg" alt="" aria-hidden="true">
        <!-- Laser.webp rotating sprite -->
        <img id="laserImg" src="assets/Laser.webp" alt="" aria-hidden="true">
        <div id="blockCover"></div>
        <div id="machineBlock"></div>
        <img id="laserBurst" src="assets/laserlight.webp" alt="">
        <div id="cutLine"></div>
        <div id="wrongSlash"></div>
        <!-- Tutorial instruction bubbles (below left/right buttons; above cut button).
             The panel SVGs are empty speech boxes — the label is live text so it
             always matches the game's regular text style. -->
        <div id="bubbleLeft" class="tutorial-bubble"><span class="tb-text">Tap to move</span></div>
        <div id="bubbleRight" class="tutorial-bubble"><span class="tb-text">Tap to move</span></div>
        <div id="bubbleCut" class="tutorial-bubble"><span class="tb-text">Tap to cut</span></div>
        <!-- Visible button images (src swaps on press) -->
        <img id="btnLeft" src="assets/LeftButton.webp" alt="" aria-hidden="true">
        <img id="btnRight" src="assets/RightButton.webp" alt="" aria-hidden="true">
        <img id="btnCut" src="assets/CutButton.webp" alt="" aria-hidden="true">
        <!-- TappedCutButton.webp tutorial highlight -->
        <img id="cutOverlay" src="assets/TappedCutButton.webp" alt="" aria-hidden="true">
        <!-- Idle nudge: points at the button the player should tap next (gameplay only) -->
        <img id="handNudge" src="assets/HandNudge.svg" alt="" aria-hidden="true">
        <!-- Invisible hit areas -->
        <button id="hitLeft" class="machine-hit" type="button" aria-label="Move laser left"></button>
        <button id="hitRight" class="machine-hit" type="button" aria-label="Move laser right"></button>
        <button id="hitCut" class="machine-hit" type="button" aria-label="Cut the block"></button>
      </div>

      <div id="flightLayer" aria-hidden="true"></div>
      <!-- Round-win confetti burst (same look as the end-screen confetti; bits
           are generated by celebrateWin() and cleared after the burst) -->
      <div id="winConfetti" class="complete-confetti hidden" aria-hidden="true"></div>

      <button id="tryAgain" class="hidden" type="button" aria-label="Try again">
        <img src="assets/TryAgainButton.webp" alt="">
      </button>

      <button id="nextButton" class="hidden" type="button" aria-label="Next">
        <img src="assets/nextButton.webp" alt="">
        <!-- Success Next: a code-built glossy orange circular arrow button, pure HTML+CSS (shown via .is-success). -->
        <span class="next-play" aria-hidden="true">
          <span class="np-body">
            <svg class="np-arrow" viewBox="0 0 100 100" aria-hidden="true">
              <path d="M22 40 H49 V27 L75 50 L49 73 V60 H22 Z" fill="#fff" stroke="#fff" stroke-width="9"
                stroke-linejoin="round" stroke-linecap="round" />
            </svg>
          </span>
        </span>
      </button>
    </section>


    <section id="completeStage" class="hidden" aria-live="polite">
      <div class="complete-copy">
        <div class="complete-title">Bots Powered Up!</div>
      </div>
      <div id="completeConfetti" class="complete-confetti" aria-hidden="true">
        <span style="--x:8%;--y:17%;--c:#4dbeff;--r:24deg;--d:.1s"></span>

      if (snap === 180) snap = 0;
      if (snap === 0) return 1;   // horizontal
      if (snap === 90) return 0;  // vertical

      var orientAngle = { vertical: 90, horizontal: 0, slash: 45, backslash: 135 };
      for (var i = 0; i < needed.length; i++) {

         first (e.g. vertical) cut the hint points the player to the
         perpendicular (horizontal) one instead of saying "already aligned". */
      if (r.cut === "grid") {
        var done = state.gridCutOrients || [];
        /* Steer toward whichever cut is still missing, so after the first cut the
           hint points to the PERPENDICULAR one instead of "already aligned".
           Axis rounds: vertical↔horizontal. Diagonal rounds (triangle1): the two
           diagonals — backslash is snap 45 (45/225), slash is snap 135 (135/315). */
        if (done.indexOf("vertical") !== -1 && done.indexOf("horizontal") === -1) {
          targets = [0, 180];
        } else if (done.indexOf("horizontal") !== -1 && done.indexOf("vertical") === -1) {
          targets = [90, 270];
        } else if (done.indexOf("backslash") !== -1 && done.indexOf("slash") === -1) {
          targets = [135, 315];   /* backslash done → steer to slash */
        } else if (done.indexOf("slash") !== -1 && done.indexOf("backslash") === -1) {
          targets = [45, 225];    /* slash done → steer to backslash */
        }
      }
      /* Button semantics (matching tutorial): LEFT button rotates +45,
         RIGHT button rotates -45. So "go +angle" → press LEFT,
         "go -angle" → press RIGHT. */
      var bestPlusSteps = Infinity, bestMinusSteps = Infinity;
      targets.forEach(function (t) {
        var plusSteps = ((t - cur + 360) % 360) / 45;
        var minusSteps = ((cur - t + 360) % 360) / 45;
        if (plusSteps < bestPlusSteps) { bestPlusSteps = plusSteps; }
        if (minusSteps < bestMinusSteps) { bestMinusSteps = minusSteps; }
      });
      if (bestPlusSteps === 0 || bestMinusSteps === 0) { return null; } /* already aligned — let cut do its thing */
      return bestPlusSteps < bestMinusSteps ? "left" : "right";
    }

    function startIdleHint() {
      stopIdleHint();
      if (state.tutActive) { return; }
      state.idleHintTimer = setTimeout(function () {
        if (!state.tutActive && !state.locked) {
          var dir = idleHintDirection();
          if (dir === "left") { els.btnLeft.classList.add("idle-hint"); }
          else if (dir === "right") { els.btnRight.classList.add("idle-hint"); }
          showHandNudge(dir);   /* dir null (already aligned) → nudge the CUT button */
        }
      }, 3000);
    }

    function later(fn, delay) {
      var id = setTimeout(fn, delay);
      state.timers.push(id);
    }

    function scheduleTeachingNext(action) {
      state.nextAction = action || null;
      hide(els.nextButton);
      els.nextButton.classList.remove("is-success");
      els.nextButton.querySelector("img").src = "assets/nextButton.webp";
      later(function () {
        els.nextButton.classList.remove("is-success");
        els.nextButton.querySelector("img").src = "assets/nextButton.webp";
        show(els.nextButton);
      }, TIMING.TEACH_NEXT_BUTTON);
    }

    function currentRound() {
      return ROUNDS[state.round];
    }

    function setInstruction(text, options) {
      if (state.teachingActive) {
        text = "";
      }
      if (!text) {
        hide(els.instruction);
        els.instructionText.textContent = "";
        return playInstructionAudio("", options);
      }
      /* While the lab-gate doors are still covering the screen, hold the panel
         hidden and stash the line — runLabGate reveals it (with the entrance
         animation + audio) the moment the doors finish opening. */
      if (state.gateOpening) {
        state.pendingInstruction = { text: text, options: options };
        hide(els.instruction);
        els.instructionText.textContent = "";
        return null;
      }
      /* Replay the face-box-then-unroll entrance on a fresh appear OR whenever the
         line changes (a new instruction beat) — but not when the same text is
         re-set on an already-showing panel. */
      var freshAppear = els.instruction.classList.contains("hidden") || els.instructionText.textContent !== text;
      els.instructionText.textContent = text;
      show(els.instruction);
      if (freshAppear) {
        els.instruction.classList.remove("intro-reveal");
        void els.instruction.offsetWidth;   /* reflow so the animation restarts */
        els.instruction.classList.add("intro-reveal");
      }
      return playInstructionAudio(text, options);
    }

    /* One-time boot intro: hold the closed gate, part the doors, then drop it so
       the start screen behind is interactive. Uses raw setTimeout (not later())
       so the boot renderStep's clearTimers can't wipe these one-off timers.
       0.5s hold + 1.2s slide; +60ms after the slide before removing. */
    /* Lab-gate transition (fired by the play button): cover the screen with the
       closed gate, advance to the next screen behind it, then part the doors —
       with the gateOpen.ogg cue — to reveal it. Raw setTimeout (not later()) so
       the nextStep->renderStep clearTimers can't wipe these one-off timers.
       The intro's charge beam is held until the doors finish (state.gateOpening)
       so the flash isn't wasted behind the closed gate. */
    function runLabGate() {
      if (!els.labGate) { nextStep(); return; }
      var gate = els.labGate;
      state.gateOpening = true;
      state.pendingInstruction = null;
      gate.classList.remove("gate-open");
      gate.classList.add("gate-active");   /* closed, covering the screen */
      void gate.offsetWidth;               /* reflow so the slide animates from closed */
      nextStep();                          /* set up the screen behind the closed doors */
      setTimeout(function () {
        gate.classList.add("gate-open");
        sndGateOpen();
      }, 500);
      setTimeout(function () {
        gate.classList.remove("gate-active", "gate-open");
        state.gateOpening = false;
        if (FLOW[state.step] && FLOW[state.step].scene === "intro") {
          playChargeBeam();
        } else if (state.pendingInstruction) {
          /* The panel was held back while the doors covered the screen — reveal it
             now (with its face-box → unroll entrance) so it plays in full view. */
          var p = state.pendingInstruction;
          state.pendingInstruction = null;
          setInstruction(p.text, p.options);
        }
      }, 2060);   /* 500ms hold + 1.5s slide + 60ms */
    }

    function playChargeBeam() {
      if (!els.botSpotlight) { return; }
      els.botSpotlight.classList.add("show", "charge-flash");
      /* raise the panel only after the cue ends, plus a breath so the light
         lands first and THEN the text arrives */
      sndChargeBeam(function () { later(revealIntroInstruction, TIMING.INTRO_TEXT_DELAY); });
    }

    function revealIntroInstruction() {
      /* The flash + flashlight cue have played; now bring up the instruction
         panel with its "Let us charge the bots." voice. Guard against a stale
         callback firing after the screen has already advanced. */
      var step = FLOW[state.step];
      if (!step || step.scene !== "intro") { return; }
      setInstruction("Let us charge the bots.");
    }

    function resetScene() {
      els.sceneBg.style.display = "none";
      els.sceneBg.src = ASSETS + "Mainbg.webp";
      if (els.botSpotlight) { els.botSpotlight.classList.remove("show", "charge-flash"); }
      if (els.focusDim) { els.focusDim.classList.remove("show"); }
      state.teachingActive = false;
      els.game.classList.remove("teaching-active", "laser-intro", "laser-intro-grid");
      /* Clear inline transitions/transforms left over by the previous round's
         success animation (switchBotsToHappy sets `transition: top 0.4s ease,
         margin-left 0.4s ease` on pods/fills and `bottom` on bots). Without
         this, the next round's setupBots writes new top/marginLeft/width
         values that *animate* from the previous round's positions over 0.4s
         — visible as the "alignment broken initially → suddenly corrects
         itself" glitch on question transitions. Safe because every code
         path that needs a transition on these elements re-applies its own
         inline transition explicitly. */
      [els.leftPod, els.rightPod].forEach(function (el) {
        if (!el) { return; }
        el.style.transition = "";
        el.classList.remove("charged-focus");
      });
      [els.leftFill, els.rightFill].forEach(function (el) {
        if (!el) { return; }
        el.style.transition = "";
        el.classList.remove("charged-focus");
      });
      if (els.bots) { els.bots.style.display = ""; }
      [els.leftBot, els.rightBot, els.midLeftBot, els.midRightBot].forEach(function (el) {
        if (!el) { return; }
        el.style.bottom = "";
        el.style.marginLeft = "";
        el.classList.remove("happy", "pod-charged-glow");
        /* Clear the grid-round entrance/celebrate styles from the bot-slots,
           and remove any charger plug seated during the charging screen. */
        if (el.parentNode) {
          el.parentNode.style.transition = "";
          el.parentNode.style.transform = "";
          el.parentNode.style.opacity = "";
          el.parentNode.classList.remove("celebrate-jump");
          var seatedPlug = el.parentNode.querySelector(".head-plug");
          if (seatedPlug) { el.parentNode.removeChild(seatedPlug); }
        }
      });
      if (els.cornerSlots) {
        hide(els.cornerSlots);
        els.cornerSlots.classList.remove("slots-high", "slots-connector", "slots-fit", "slots-diamond", "slots-tall");
        els.cornerSlotEls.forEach(function (slot) { slot.classList.remove("show"); });
      }
      if (els.podConnectors) {
        hide(els.podConnectors);
        els.podConnectors.innerHTML = "";
      }
      hide(els.shapeStage);
      hide(els.teachStage);
      hide(els.playStage);
      hide(els.machineStage);
      hide(els.tryAgain);
      if (els.winConfetti) {
        hide(els.winConfetti);
        els.winConfetti.innerHTML = "";
      }
      hide(els.nextButton);
      els.nextButton.classList.remove("is-success");
      els.nextButton.querySelector("img").src = "assets/nextButton.webp";
      hide(els.completeStage);
      if (els.clueCard) { els.clueCard.classList.add("hidden"); }
      state.nextAction = null;
      els.shapeStage.innerHTML = "";
      els.teachContent.innerHTML = "";
      if (els.playFx) { els.playFx.innerHTML = ""; }
      els.iraChar.classList.remove("play-idle");
      if (els.iraChar.pause) { els.iraChar.pause(); }   /* stop the Ira clip when leaving the screen (it's a <video> now) */
      els.iraGlowRing.classList.remove("show");
      els.playStage.classList.remove("play-exit", "start-mode", "preplay-mode");
      els.playButton.classList.remove("play-ready", "play-clicked");
      els.machineBlock.classList.remove("vibrate");
      els.machineBlock.classList.remove("rejoin-pop");
      els.machineBlock.style.opacity = "";
      els.machineBlock.style.transform = "";   /* clear diamond-round rotation */
      if (els.blockCover) { els.blockCover.style.transform = ""; }
      els.machineBlock.innerHTML = "";
      els.machineStage.classList.remove("checking-fit");
      els.flightLayer.innerHTML = "";
      clearTargetFills();
      clearAttemptGuides();
      els.wrongSlash.classList.remove("show");
      els.leftPod.classList.remove("front-layer");
      els.rightPod.classList.remove("front-layer");
      if (state.orbitRaf) { cancelAnimationFrame(state.orbitRaf); state.orbitRaf = null; }
      if (state.previewRaf) { cancelAnimationFrame(state.previewRaf); state.previewRaf = null; }
      state.orbitActive = false;
      els.laserImg.style.display = "none";
      els.laserImg.classList.remove("laser-spotlight");
      els.beamImg.style.display = "none";
      els.laserBurst.classList.remove("show");
      [els.bubbleLeft, els.bubbleRight, els.bubbleCut].forEach(function (el) {
        el.classList.add("fade");
      });

      els.cutOverlay.classList.remove("flash");

      els.btnRight.src = ASSETS + "RightButton.webp";
      els.btnCut.src = ASSETS + "CutButton.webp";
      els.btnLeft.classList.remove("tut-highlight", "tut-disabled");
      els.btnRight.classList.remove("tut-highlight", "tut-disabled");
      els.btnCut.classList.remove("tut-highlight", "tut-disabled");
      els.leftPod.classList.remove("socket-focus");
      els.rightPod.classList.remove("socket-focus");
      els.leftPod.classList.remove("charged-focus");
      els.rightPod.classList.remove("charged-focus");
      stopIdleHint();
      els.hitLeft.disabled = false;
      els.hitRight.disabled = false;
      els.hitCut.disabled = false;
      state.locked = false;
      state.tutActive = false;
      state.tutStep = 0;
    }

    function isIntroPlacement(layout) {
      return layout === "layout-intro" || layout === "layout-intro-plug" || layout === "layout-intro-connected";
    }

    function botWidthForLayout(r, layout) {
      if (isIntroPlacement(layout)) {
        return r.botWIntro;
      }
      if (layout === "layout-laser") {
        return r.botWLaser || r.botWReady;
      }
      return r.botWReady;
    }

    function showsChargingPods(layout) {
      return layout === "layout-ready" || layout === "layout-laser" ||
        layout === "layout-intro-plug" || layout === "layout-intro-connected";
    }

    function introPlugYOffset(layout) {
      return layout === "layout-intro-plug" || layout === "layout-intro-connected" ? 18 : 0;
    }

    function connectedPodPlacement(layout, options) {
      return layout === "layout-intro-connected" ||
        layout === "layout-intro-plug" ||
        layout === "layout-ready" ||
        layout === "layout-laser";
    }

    function connectorOverlapBoostForRound(r, layout, options) {
      if (!connectedPodPlacement(layout, options)) {
        return 0;
      }
      if (layout === "layout-ready" && r && r.readyConnectorOverlapBoost !== undefined) {
        return r.readyConnectorOverlapBoost;
      }
      if (layout === "layout-laser" && r && r.laserConnectorOverlapBoost !== undefined) {
        return r.laserConnectorOverlapBoost;
      }
      return r && r.connectorOverlapBoost !== undefined ? r.connectorOverlapBoost : 0;
    }

    function clearPodIntroLayers() {
      Array.prototype.slice.call(els.bots.querySelectorAll(".pod-seq-layer")).forEach(function (node) {
        if (node.parentNode) {
          node.parentNode.removeChild(node);
        }
      });
    }

    function clearHollowFocusLayers() {
      Array.prototype.slice.call(els.bots.querySelectorAll(".pod-hollow-focus, .pod-hollow-focus-frame")).forEach(function (node) {
        if (node.parentNode) {
          node.parentNode.removeChild(node);
        }
      });
    }

    function clearConnectorStemCovers() {
      Array.prototype.slice.call(els.bots.querySelectorAll(".pod-connector-neck-cover")).forEach(function (node) {
        if (node.parentNode) {
          node.parentNode.removeChild(node);
        }
      });
    }

    function addPodIntroLayer(slotEl, podEl, className, delay) {
      var layer = document.createElement("img");
      layer.className = "pod-seq-layer " + className;
      layer.src = podEl.src;
      layer.alt = "";
      layer.setAttribute("aria-hidden", "true");
      layer.style.top = podEl.style.top;
      layer.style.width = podEl.style.width;
      layer.style.transform = podEl.style.transform;
      layer.style.marginLeft = podEl.style.marginLeft || "0px";
      if (delay) {
        layer.style.animationDelay = delay + "ms";
      }
      slotEl.insertBefore(layer, podEl);
    }

    function addPlugIntroSequence(options) {
      options = options || {};
      if (!options.connect) { return; }
      [
        { slot: els.leftBot.parentNode, pod: els.leftPod, delay: 0 },
        { slot: els.rightBot.parentNode, pod: els.rightPod, delay: 60 }
      ].forEach(function (item) {
        addPodIntroLayer(item.slot, item.pod, "pod-seq-hollow", item.delay);
        addPodIntroLayer(item.slot, item.pod, "pod-seq-cable", 460 + item.delay);
      });
    }

    /* Hides a horizontal band of the pod-img via a CSS mask. Used to remove the
       "neck" taper in the circle-horizontal LEFT pod asset, where the asset's
       narrow arc tip transitions through a wide cream taper into the cable —
       the orange piece's narrow apex can't cover that taper, so the cream
       reads as an asymmetric "thick rim" next to the other pod. Hiding the
       band makes the cable visually emerge from the orange's apex like the
       other side. `band` is `{start, end}` as fractions of the pod-img height,
       or null/undefined to clear. */
    function applyPodMaskBand(podEl, band) {
      if (!podEl) { return; }
      if (!band) {
        podEl.style.webkitMaskImage = "";
        podEl.style.maskImage = "";
        return;
      }
      var startPct = (band.start * 100).toFixed(3) + "%";
      var endPct = (band.end * 100).toFixed(3) + "%";
      var grad = "linear-gradient(to bottom, black 0%, black " + startPct +
        ", transparent " + startPct + ", transparent " + endPct +
        ", black " + endPct + ", black 100%)";
      podEl.style.webkitMaskImage = grad;
      podEl.style.maskImage = grad;
    }

    function connectorStemCoverForRound(r, side, podW) {
      if (!r || !r.connectorStemCover) { return null; }
      var cfg = side === "right" ? r.connectorStemCover.right : r.connectorStemCover.left;
      if (!cfg) { return null; }
      var scale = podW / (r.podW || podW || 1);
      return {
        top: (cfg.top || 0) * scale,
        width: (cfg.width || 20) * scale,
        height: (cfg.height || 15) * scale,
        x: (cfg.x || 0) * scale
      };
    }

    function connectorStemCoverNode(slotEl) {
      var covers = slotEl ? slotEl.querySelectorAll(".pod-connector-neck-cover") : [];
      return covers.length ? covers[0] : null;
    }

    function addConnectorStemCover(slotEl, podEl) {
      var r = currentRound();
      var side = slotEl.classList.contains("right-bot") ? "right" : "left";
      var podW = parseFloat(podEl.style.width) || (r && r.podW) || 132;
      var cfg = connectorStemCoverForRound(r, side, podW);
      if (!cfg) { return; }
      var cover = connectorStemCoverNode(slotEl);
      if (!cover) {
        cover = document.createElement("div");
        cover.className = "pod-connector-neck-cover visible";
        cover.setAttribute("aria-hidden", "true");
        slotEl.insertBefore(cover, podEl.nextSibling);
      }
      cover.setAttribute("aria-hidden", "true");
      cover.classList.add("visible");
      cover.style.transition = podEl.style.transition || "top .4s ease, margin-left .4s ease";
      cover.style.top = (parseFloat(podEl.style.top) + cfg.top) + "px";
      cover.style.marginLeft = ((parseFloat(podEl.style.marginLeft) || 0) + cfg.x) + "px";
      cover.style.setProperty("--connector-cover-w", cfg.width + "px");
      cover.style.setProperty("--connector-cover-h", cfg.height + "px");
    }

    function diagonalSemicircleFocusPath(r, side, w, h, pad) {
      var angle = canonicalCutAngle(r) * Math.PI / 180;
      var orientation = cutOrientation(canonicalCutAngle(r));
      var slotIndex = side === "right" ? 1 : 0;
      var pieceIndex = pieceIndexForSlot(r, slotIndex);
      var keepSign = lineSideForPiece(orientation, pieceIndex);
      var cx = pad + w / 2;
      var cy = pad + h / 2;
      var radius = Math.min(w, h) / 2;
      var dx = Math.cos(angle);
      var dy = Math.sin(angle);
      var startA = angle;
      var endA = angle + Math.PI;
      var midA = Math.atan2(-dx * keepSign, dy * keepSign);
      var twoPi = Math.PI * 2;

      function norm(a) {
        a = a % twoPi;
        return a < 0 ? a + twoPi : a;
      }

      function forwardDistance(a, b) {
        return (norm(b) - norm(a) + twoPi) % twoPi;
      }

      function point(a) {
        return {
          x: cx + Math.cos(a) * radius,
          y: cy + Math.sin(a) * radius
        };
      }

      function fmt(p) {
        return p.x.toFixed(1) + "," + p.y.toFixed(1);
      }

      var start = point(startA);
      var end = point(endA);
      var forwardArc = forwardDistance(endA, midA) <= Math.PI + 0.001;
      var arcDistance = forwardArc ? forwardDistance(endA, startA) : forwardDistance(startA, endA);
      var path = "M" + fmt(start) + " L" + fmt(end);
      var steps = 28;
      for (var i = 1; i <= steps; i++) {
        var t = i / steps;
        var a = forwardArc ? endA + arcDistance * t : endA - arcDistance * t;
        path += " L" + fmt(point(a));
      }
      return path + " Z";
    }

    function addSemicircleFocusLayer(slotEl, side) {
      var r = currentRound();
      if (!r || r.name !== "circle" ||
        (r.variant !== "circle-horizontal" && r.variant !== "circle-vertical" &&
          r.variant !== "circle-diagonal")) {
        return false;
      }
      var fill = side === "right" ? els.rightFill : els.leftFill;
      if (!fill) { return false; }

      // Diagonal-circle: outline the SAME calibrated hollow shape the fill uses,
      // anchored to the pod box, so the cyan highlight traces the hollow exactly
      // (instead of the old slot-relative, hand-offset path that drifted inside it).
      if (r.variant === "circle-diagonal") {
        var dgeo = DIAG_HOLLOW_GEOMETRY[podBasename(side === "right" ? r.podRight : r.podLeft)];
        var dpod = side === "right" ? els.rightPod : els.leftPod;
        if (dgeo && dpod) {
          var fPodW = r.podW || 132;
          var fPodH = diagPodH(r, side);
          // The left/right pods are different assets with hollows ~6% different in size.
          // The cue uses ONE uniform radius so both sides look equal; biased slightly small
          // so it never spills out of the smaller hollow (at most a hair inside the larger).
          var fcx = dgeo.fx * fPodW, fcy = dgeo.fy * fPodW, frr = DIAG_FOCUS_RADIUS_FRAC * fPodW;
          var fd = semicircleSegmentPath(fcx, fcy, frr, dgeo.diamAng, dgeo.keepDir, DIAG_FILL_FLATPAD);
          var fns = "http://www.w3.org/2000/svg";
          var fsvg = document.createElementNS(fns, "svg");
          fsvg.setAttribute("viewBox", "0 0 " + fPodW + " " + fPodH);
          fsvg.classList.add("pod-hollow-focus-frame", "semicircle-focus", r.variant, "slot-" + side);
          fsvg.setAttribute("aria-hidden", "true");
          fsvg.style.top = (parseFloat(dpod.style.top) || 0) + "px";
          fsvg.style.width = fPodW + "px";
          fsvg.style.height = fPodH + "px";
          fsvg.style.marginLeft = (parseFloat(dpod.style.marginLeft) || 0) + "px";
          fsvg.style.transform = "translateX(-50%)"; // centre on the pod even before the pulse animation starts
          fsvg.style.transformOrigin = fcx + "px " + fcy + "px"; // pulse scales around the hollow, not the tall box
          ["semicircle-focus-aura", "semicircle-focus-rim"].forEach(function (className) {
            var fp = document.createElementNS(fns, "path");
            fp.setAttribute("class", className);
            fp.setAttribute("d", fd);
            fsvg.appendChild(fp);
          });
          slotEl.insertBefore(fsvg, fill.nextSibling);
          return true;
        }
      }

      var baseW = parseFloat(fill.style.width) || targetSlotSizeForRound(r).width;
      var baseH = parseFloat(fill.style.height) || targetSlotSizeForRound(r).height;
      var top = parseFloat(fill.style.top) || 0;
      var marginLeft = parseFloat(fill.style.marginLeft) || 0;
      var pad = r.variant === "circle-diagonal" ? 14 : (r.variant === "circle-vertical" ? 12 : 10);
      var focusOffset = (r.semicircleFocusOffset && (side === "right" ? r.semicircleFocusOffset.right : r.semicircleFocusOffset.left)) || {};
      var focusScaleCfg = r.semicircleFocusScale;
      var focusScale = 1;
      if (typeof focusScaleCfg === "number") {
        focusScale = focusScaleCfg;
      } else if (focusScaleCfg) {
        focusScale = side === "right" ? (focusScaleCfg.right || 1) : (focusScaleCfg.left || 1);
      }
      var w = baseW * focusScale;
      var h = baseH * focusScale;
      var svgW = w + pad * 2;
      var svgH = h + pad * 2;
      var p = pad;
      var d = "";

      if (r.variant === "circle-horizontal") {
        if (side === "right") {
          d = "M" + p + "," + (p + h) +
            " L" + (p + w) + "," + (p + h) +
            " C" + (p + w) + "," + (p - h * 0.333) +
            " " + p + "," + (p - h * 0.333) +
            " " + p + "," + (p + h) + " Z";
        } else {
          d = "M" + p + "," + p +
            " L" + (p + w) + "," + p +
            " C" + (p + w) + "," + (p + h * 1.333) +
            " " + p + "," + (p + h * 1.333) +
            " " + p + "," + p + " Z";
        }
      } else if (r.variant === "circle-vertical" && side === "right") {
