<!DOCTYPE html>
<!--
  ============================================================================
  THE STORY NIGHT  —  interactive 3D flipbook (Neel & the dragon)
  ----------------------------------------------------------------------------
  • No build step, no frameworks. Just open this file in any modern browser.
  • A real 3D hardcover book: it has thickness, a spine, sits angled and casts a
    soft shadow. Tap PLAY to open it (the cover swings on the spine), then flip.
  • Full-bleed picture-book pages: page 1 is a video, pages 2-4 are scenes with
    a speech bubble that pops in once you fully land on the page.
  • Structure is split into THREE files:
        index.html   → this markup
        styles.css   → all styling + the night theme + animations
        script.js    → the flip engine + the page content (EDIT PAGES THERE)
  ============================================================================
-->
<html lang="en">
<!-- Media formats: story videos are WebM (VP9/Opus) and audio is Ogg/Opus —
     both supported by Chrome, Edge, Firefox and recent Safari versions.
     Images are WebP (universal in evergreen browsers). -->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Saving the Parade</title>

<!-- ── Google Fonts: Fredoka (headings + speech bubbles) + Patrick Hand & Caveat ── -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap"
  rel="stylesheet"
/>

<!-- All styling lives in styles.css -->
<link rel="stylesheet" href="styles.css" />
</head>

<body class="boot-loading">
<!-- Landscape lock: on phones/tablets (touch), the book shows only in landscape.
     In portrait the scene is hidden and this rotate prompt is shown instead. -->
<div class="rotate-notice" id="rotateNotice">
  <div class="rotate-inner">
    <div class="rotate-icon">🔄</div>
    <div class="rotate-text">Please rotate your device<br />to landscape to read</div>
  </div>
</div>
<div class="scene">
  <div class="stage">
    <!-- Fixed 1280×720 book layer. JS scales it (transform) to fit the screen. -->
    <div class="flip-scale" id="flipScale">
    <!-- INNER scale wrapper: the open motion runs here, so it composes with the
         outer responsive scale of .flip-scale. -->
    <div class="book-stage" id="bookStage">
    <!-- Outer hardcover outline — visible once the book is open -->
    <div class="book-frame"></div>
    <div class="floor-shadow"></div>

    <!-- The page-turning book mounts here (JS injects one .leaf per page).
         Sits beneath the 3D cover layer; revealed once the cover swings open.
         .page-stack = the tan fore-edge of the pages still to be turned (right). -->
    <div id="flipbook">
      <div class="page-stack" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <!-- Moving shadow the opening cover casts on the inside page. -->
    <div class="cover-cast"></div>

    <!-- The 3D hardcover + cover-opening animation (own perspective layer). -->
    <div class="cover-scene" id="coverScene">
    <div class="book-float" id="bookFloat">
      <div class="book-pop" id="bookPop">
        <div class="book" id="book">
          <div class="book-inner" id="bookInner">

            <!-- Open-book back cover backing -->
            <div class="book-body"></div>

            <!-- The 3D page block that gives the closed book its thickness -->
            <div class="pageblock">
              <div class="pbf pb-back"></div>
              <div class="pbf pb-left"></div>
              <div class="pbf pb-right"></div>
              <div class="pbf pb-top"></div>
              <div class="pbf pb-bottom"></div>
              <div class="pbf pb-front"></div>
            </div>

            <!-- Front hardcover (last so it stacks in front when closed). -->
            <div class="cover-holder">
            <div class="cover" id="cover">
              <div class="face front">
                <div class="cover-img"></div>
                <!-- FUTURISTIC HUD frame: a thin neon-teal + violet double rule with
                     angular corner brackets and glowing nodes (no gold, no filigree).
                     One SVG in book-space (1280×720) so it scales crisply with the book. -->
                <svg class="cover-frame" viewBox="0 0 1280 720" aria-hidden="true">
                  <defs>
                    <!-- angular HUD corner bracket (top-left; mirrored to the others) -->
                    <g id="hudCorner" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M42 168 L42 42 L168 42" stroke="#2fe6d6" stroke-width="4.5"/>
                      <path d="M62 118 L62 62 L118 62" stroke="#8a5cff" stroke-width="2.2" opacity="0.85"/>
                      <circle cx="42" cy="42" r="6.5" fill="#eafffb" stroke="#2fe6d6" stroke-width="2.4"/>
                      <circle cx="196" cy="42" r="3.6" fill="#2fe6d6"/>
                      <circle cx="42" cy="196" r="3.6" fill="#2fe6d6"/>
                    </g>
                    <!-- neon diamond node for the edge midpoints (replaces the old stars) -->
                    <g id="hudNode">
                      <path d="M0 -8 L8 0 L0 8 L-8 0 Z" fill="#2fe6d6"/>
                      <path d="M0 -3.6 L3.6 0 L0 3.6 L-3.6 0 Z" fill="#eafffb"/>
                    </g>
                  </defs>
                  <!-- thin double neon rule framing the poster -->
                  <rect x="40" y="40" width="1200" height="640" rx="12" fill="none" stroke="#2fe6d6" stroke-width="2.6" opacity="0.9"/>
                  <rect x="53" y="53" width="1174" height="614" rx="9" fill="none" stroke="#8a5cff" stroke-width="1.4" opacity="0.65"/>
                  <!-- four angular corner brackets -->
                  <use href="#hudCorner"/>
                  <use href="#hudCorner" transform="translate(1280,0) scale(-1,1)"/>
                  <use href="#hudCorner" transform="translate(0,720) scale(1,-1)"/>
                  <use href="#hudCorner" transform="translate(1280,720) scale(-1,-1)"/>
                  <!-- glowing edge nodes -->
                  <use href="#hudNode" transform="translate(640,40)"/>
                  <use href="#hudNode" transform="translate(640,680)"/>
                  <use href="#hudNode" transform="translate(40,360)"/>
                  <use href="#hudNode" transform="translate(1240,360)"/>
                </svg>
                <div class="back-fill"></div>
                <div class="curl"></div>
                <button class="play-btn" id="hint" type="button" aria-label="Play — open the book">
                  <!-- Custom play-button artwork (assets/play-button.webp). -->
                  <img class="play-img" src="assets/play-button.webp" alt="Play" draggable="false" />
                </button>
                <!-- Stage-A shell preloader — a themed HUD progress bar shown in the
                     Play button's place while the shell assets stream in. The Play
                     button is revealed (with a pop) only at 100%. -->
                <div class="boot-loader" id="bootLoader" role="progressbar"
                     aria-label="Loading the story" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <div class="boot-loader-track">
                    <div class="boot-loader-fill" id="bootLoaderFill"></div>
                  </div>
                  <div class="boot-loader-label" id="bootLoaderLabel">Loading&hellip;</div>
                </div>
              </div>
              <!-- BACK of the front cover: intentionally BLANK (plain dark board). -->
              <div class="face back"></div>
            </div>
            </div><!-- /cover-holder -->

          </div>
        </div>
      </div>
    </div>
    </div><!-- /cover-scene -->

    <!-- Flat, top-most, transparent tap zone that only OPENS the book. -->
    <div class="tap-catcher" id="tapCatcher"></div>

    <!-- (THE END is now a real final PAGE — the last leaf, built by script.js:
         a cream "paper" page with "THE END" + a Replay button. Replay closes the
         whole book, reverse of the opening swing, back to the front cover.) -->
    </div><!-- /book-stage -->
    </div><!-- /flip-scale -->
  </div>

  <!-- Progress read-out -->
  <!-- (page counter removed) -->
</div>

<!-- HOME button — top-left, shown only while reading (hidden on the cover, the
     last page and the end). Closes the book (reverse of the opening swing) back
     to the front cover. -->
<button class="home-btn" id="homeBtn" type="button" aria-label="Back to the cover">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
  </svg>
</button>

<!-- Flip arrows OUTSIDE the book, fixed at the viewport's bottom corners
     (bottom-left = back, bottom-right = forward). -->
<button class="corner-arrow back" id="cornerPrev" aria-label="Previous page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>
<button class="corner-arrow fwd" id="cornerNext" aria-label="Next page">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="M46 19 L30 5 L30 12 C20 11 11 15 6 30 L12 33 C18 24 22 24 30 24 L30 33 Z" fill="currentColor"/>
  </svg>
</button>

<!-- ── Embedded LBD game (PowerUp Bots) ──
     A body-level overlay (NOT inside the 3D book, a page leaf, or any transformed
     wrapper) so it can expand to a true full-screen box — a CSS transform on the
     book would otherwise trap position:fixed. The iframe starts at about:blank and
     is warmed in the background after window load (the game is silent on boot).
     script.js reveals it over the game page's frame when the reader lands there;
     the game's own "Let's Go" tap (relayed by game/embed-bridge.js as lbd-start)
     expands it to fullscreen, and on completion the NEXT button below appears
     over the win screen — tapping it returns to the book and turns the page. -->
<div class="lbd-stage" id="lbdStage" aria-hidden="true">
  <iframe id="lbdFrame" title="Interactive learning game" src="about:blank"
          allow="autoplay; fullscreen" allowfullscreen></iframe>
  <!-- End-of-game NEXT button. Hidden (and disabled) until the game reports it
       is complete; the game never advances the book on its own — the reader taps
       this to close the game and turn to the next story page. -->
  <button class="lbd-next" id="lbdNextBtn" type="button" disabled aria-hidden="true"
          aria-label="Next page">
    <span>Next</span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 11h11.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H4z" fill="currentColor"/>
    </svg>
  </button>
</div>

<!-- Inlined one-shot SFX (base64) for glitch-free Web Audio playback on file:// -->
<script src="sfx-data.js"></script>
<!-- Two-stage asset preloader (Stage A gates the Play button; Stage B warms
     later pages + the embedded game in the background). -->
<script src="preload.js"></script>
<!-- All behaviour lives in script.js -->
<script src="script.js"></script>
</body>
</html>
